<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NOVA AI</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#0c101b;color:#f4f5ff;font-family:Arial,sans-serif}
.app{height:100dvh;display:flex;flex-direction:column;max-width:720px;margin:auto}
header{padding:calc(22px + env(safe-area-inset-top, 0px)) 18px 22px;background:#151b2b;border-bottom:1px solid #293248}
.chat-actions{display:flex;justify-content:flex-end;padding:6px 0 12px}
.clear-history{background:#30384c;color:#d8def0;font-size:12px;padding:9px 12px;border-radius:10px}

.brand{font-size:23px;font-weight:bold;letter-spacing:2px}
.subtitle{font-size:12px;color:#a7b1cc;margin-top:5px}
main{flex:1;overflow:auto;padding:18px}
.message{padding:14px 16px;border-radius:17px;max-width:88%;margin-bottom:14px;line-height:1.5}
.nova{background:#242b40}
.user{background:#344c87;margin-left:auto}
.bottom{background:#151b2b;border-top:1px solid #293248;padding:12px 12px max(16px, env(safe-area-inset-bottom))}
.compose{display:flex;gap:9px}
input{flex:1;min-width:0;border:1px solid #39435e;background:#20283b;color:white;border-radius:22px;padding:14px;font-size:15px}
button{border:0;background:#6d70f5;color:white;border-radius:16px;padding:0 18px;font-size:18px}
nav{display:flex;justify-content:space-around;padding:14px 0 6px;color:#b8c1dc;font-size:13px}
nav span{cursor:pointer;padding:5px}
nav .active{color:#999bff;font-weight:bold}
.panel{background:#20283b;border-radius:15px;padding:18px;margin-bottom:12px}
.small{color:#a7b1cc;font-size:13px}
.council-input{width:100%;min-height:112px;resize:vertical;border:1px solid #39435e;background:#141c2d;color:white;border-radius:12px;padding:12px;font-size:15px;line-height:1.5}
.council-button{padding:12px 16px;font-size:14px;min-height:44px;margin:8px 7px 0 0}
.council-stop{background:#814453}
.council-stage{white-space:pre-wrap;overflow-wrap:anywhere;background:#141c2d;border-radius:12px;padding:12px;line-height:1.5;font-size:14px;min-height:48px}
.council-heading{font-size:15px;font-weight:bold;margin:8px 0}
.council-saved{display:block;width:100%;text-align:left;font-size:13px;padding:10px;margin:8px 0;background:#303b57;overflow-wrap:anywhere}
.council-check{font-size:13px;margin:7px 0;color:#cad4e8}
button:disabled{opacity:.45}
</style>
</head>
<body>
<div class="app">
<header>
<div class="brand">✦ NOVA · DIRECTOR LAB</div>
<div class="subtitle">Gemma офлайн · режиссёрский совет и Critic (тест)</div>
</header>
<main id="content"></main>
<div class="bottom">
<nav>
<span class="active" data-tab="chat">💬 Чат</span>
<span data-tab="council">🎬 Совет</span>
<span data-tab="projects">📁 Проекты</span>
<span data-tab="tools">🧠 Инструменты</span>
</nav>
<div class="compose" id="compose">
<input id="message" placeholder="Напиши задачу NOVA...">
<button id="stop" aria-label="Остановить ответ" style="display:none">■</button>
<button id="send" aria-label="Отправить">➤</button>
</div>
</div>
</div>
<script>
const content=document.getElementById('content');
const compose=document.getElementById('compose');
const input=document.getElementById('message');
const welcome={who:'nova',text:'Привет! Я NOVA. Твой локальный ИИ-режиссёр. 🎬'};
let savedHistory=[];
try{
 const stored=JSON.parse(localStorage.getItem('nova_chat_history') || '[]');
 if(Array.isArray(stored)){
  savedHistory=stored.filter(m=>
   m && (m.who==='user' || m.who==='nova') &&
   typeof m.text==='string' &&
   !m.text.startsWith('❌') &&
   m.text!=='🎬 NOVA думает...'
  ).slice(-100);
 }
}catch(e){ console.warn('История не загружена',e); }
const history=[welcome,...savedHistory];

function saveHistory(){
 try{
  localStorage.setItem('nova_chat_history',
   JSON.stringify(history.slice(1).filter(m=>
    m.text!=='🎬 NOVA думает...' &&
    !m.text.startsWith('❌')
   ).slice(-100))
  );
 }catch(e){ console.warn('История не сохранена',e); }
}
function addMessage(who,text){
 const el=document.createElement('div');
 el.className='message '+who;
 el.textContent=text;
 content.appendChild(el);
}
function showChat(){
 content.replaceChildren();

 const actions=document.createElement('div');
 actions.className='chat-actions';

 const clear=document.createElement('button');
 clear.className='clear-history';
 clear.textContent='🗑 Очистить историю';
 clear.disabled=busy;
 clear.onclick=()=>{
  if(!confirm('Удалить всю переписку с NOVA?'))return;
  history.splice(1);
  saveHistory();
  showChat();
 };

 actions.appendChild(clear);
 content.appendChild(actions);

 history.forEach(m=>addMessage(m.who,m.text));
 content.scrollTop=content.scrollHeight;
}
let busy=false;

async function send(){
 const text=input.value.trim();
 if(!text || busy)return;

 busy=true;
 document.getElementById('send').disabled=true;

 history.push({who:'user',text});
 input.value='';

 const waiting={who:'nova',text:'🎬 NOVA думает...'};
 history.push(waiting);
 showChat();

 try{
  const brain=window.Capacitor?.Plugins?.NovaBrain;
  if(!brain){
    throw new Error('Android-мост NovaBrain недоступен');
  }

  let result=await brain.status();

  if(result.engine !== 'ModelReady'){
    waiting.text='🧠 NOVA запускает локальный мозг...';
    showChat();

    await novaPrepareOnce();
    result=await brain.status();

    if(result.engine !== 'ModelReady'){
      throw new Error('Модель не готова: '+result.engine+(result.detail?' — '+result.detail:''));
    }
  }

  const requestId='nova-'+Date.now()+'-'+Math.random().toString(36).slice(2);
  let streamed='';
  let stopped=false;
  const stopButton=document.getElementById('stop');
  const subscription=await brain.addListener('token',event=>{
    if(event.requestId!==requestId)return;
    streamed+=event.token || '';
    waiting.text=streamed || '🎬 NOVA думает...';
    if(document.querySelector('nav span.active')?.dataset.tab==='chat'){
      const nodes=content.querySelectorAll('.message.nova');
      if(nodes.length)nodes[nodes.length-1].textContent=waiting.text;
      content.scrollTop=content.scrollHeight;
    }
  });
  stopButton.style.display='inline-block';
  stopButton.disabled=false;
  stopButton.onclick=async()=>{
    stopped=true;
    stopButton.disabled=true;
    try{await brain.cancelChat();}
    catch(error){console.warn('NOVA: отмена не удалась',error);}
  };
  try{
    const answer=await brain.chat({message:text,requestId});
    waiting.text=answer.answer || streamed || (stopped?'Ответ остановлен.':'NOVA вернула пустой ответ.');
  }finally{
    stopButton.style.display='none';
    stopButton.onclick=null;
    await subscription.remove();
  }
 }catch(error){
  waiting.text='❌ Ошибка NOVA: '+error.message;
 }finally{
  busy=false;
  saveHistory();
  document.getElementById('send').disabled=false;
  showChat();
 }
}
document.getElementById('send').onclick=send;
input.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
document.querySelectorAll('nav span').forEach(tab=>{
 tab.onclick=()=>{
  document.querySelectorAll('nav span').forEach(x=>x.classList.remove('active'));
  tab.classList.add('active');
  const selected=tab.dataset.tab;
  compose.style.display=selected==='chat'?'flex':'none';
  if(selected==='chat')return showChat();
  if(selected==='council')return showCouncil();
  content.replaceChildren();
  const panel=document.createElement('div');
  panel.className='panel';
  if(selected==='projects'){
   panel.textContent='🎬 Проекты NOVA';
   const note=document.createElement('p');
   note.className='small';
   note.textContent='Здесь появятся реальные видео и результаты монтажа после подключения движка.';
   panel.appendChild(note);
  }else{
   panel.textContent='🧠 Инструменты NOVA';
   const note=document.createElement('p');
   note.className='small';
   note.textContent='Director Council и текстовый Critic: тестовый режим. Vision, монтаж и второй ИИ пока не подключены.';
   panel.appendChild(note);
   const diagnostics=document.createElement('p');
   diagnostics.className='small';
   diagnostics.textContent='🧠 Проверяю загруженную модель...';
   panel.appendChild(diagnostics);
   const brain=window.Capacitor?.Plugins?.NovaBrain;
   if(brain){
     brain.status().then(status=>{
       diagnostics.textContent='🧠 Модель: '+(status.model||'не загружена')+
         ' | Состояние: '+status.engine+
         (status.detail?' | '+status.detail:'');
     }).catch(error=>{diagnostics.textContent='Диагностика: '+error.message;});
   }else diagnostics.textContent='Диагностика недоступна';
  }
  content.appendChild(panel);
 };
});
showChat();


// Offline Director Council v1: three sequential roles using the ONE loaded model.
// All generated strings are written via textContent (no HTML from LLM).
let councilState={
 running:false, task:'', phase:'', plan:'', critic:'', final:'',
 last:null, error:'', entries:[], loadedHistory:false, requestId:''
};
const councilLabels={
 plan:'1/3 · NOVA — режиссёр',
 critic:'2/3 · Внутренний голос — второй взгляд',
 final:'3/3 · NOVA — итоговое решение'
};
function addCouncilElement(parent, tag, className, text){
 const el=document.createElement(tag);
 if(className)el.className=className;
 if(text!==undefined)el.textContent=text;
 parent.appendChild(el);
 return el;
}
function showCouncil(){
 content.replaceChildren();
 const shell=addCouncilElement(content,'section','panel');
 addCouncilElement(shell,'div','council-heading','🎬 Режиссёрский совет');
 addCouncilElement(shell,'p','small',
  'Тест: одна локальная Gemma играет три роли по очереди. Qwen и монтаж пока не подключены.');
 const editor=addCouncilElement(shell,'textarea','council-input');
 editor.id='council-task';
 editor.maxLength=1200;
 editor.placeholder='Например: ролик-ужас про зеркало, 35 секунд, без скримеров...';
 editor.value=councilState.task;
 editor.disabled=councilState.running;
 editor.oninput=()=>{councilState.task=editor.value;};
 const run=addCouncilElement(shell,'button','council-button','🎬 Обсудить идею');
 run.disabled=councilState.running;
 run.onclick=startCouncil;
 const stop=addCouncilElement(shell,'button','council-button council-stop','■ Остановить');
 stop.disabled=!councilState.running;
 stop.onclick=stopCouncil;
 const phaseLabel=councilState.running
   ? (councilLabels[councilState.phase] || 'Подготовка модели...')
   : (councilState.last?'Совет завершён. План сохранён на телефоне.':'Готова обсудить идею');
 addCouncilElement(shell,'p','small',phaseLabel);
 if(councilState.error) addCouncilElement(shell,'p','small','⚠ '+councilState.error);
 for(const [key,label] of Object.entries(councilLabels)){
   const panel=addCouncilElement(content,'section','panel');
   addCouncilElement(panel,'div','council-heading',label);
   const box=addCouncilElement(panel,'div','council-stage',councilState[key] || '—');
   box.id='council-'+key;
 }
 if(councilState.last){
   const checkPanel=addCouncilElement(content,'section','panel');
   addCouncilElement(checkPanel,'div','council-heading','🔍 Critic: проверка текстового плана');
   if(Array.isArray(councilState.last.checks)){
     councilState.last.checks.forEach(check=>{
       addCouncilElement(checkPanel,'div','council-check',
         (check.passed?'✓ ':'○ ')+check.label);
     });
   }else{
     addCouncilElement(checkPanel,'div','small',
       'Сохранено: '+(councilState.last.checksPassed||0)+
       ' из '+(councilState.last.checksTotal||4)+' текстовых признаков.');
   }
   addCouncilElement(checkPanel,'p','small',
     'Это только анализ текста. Кадры, монтаж и синхронизация звука здесь не проверялись.');
 }
 const historyPanel=addCouncilElement(content,'section','panel');
 addCouncilElement(historyPanel,'div','council-heading','📁 Сохранённые идеи');
 const entries=Array.isArray(councilState.entries)?councilState.entries:[];
 if(entries.length===0)addCouncilElement(historyPanel,'p','small','Здесь будут последние 8 законченных обсуждений.');
 entries.forEach((entry,index)=>{
   const button=addCouncilElement(historyPanel,'button','council-saved',
     (index+1)+'. '+(entry.task||'Без названия').slice(0,110));
   button.disabled=councilState.running;
   button.onclick=()=>{
     councilState.task=entry.task||'';
     councilState.plan=entry.plan||'';
     councilState.critic=entry.critic||'';
     councilState.final=entry.final||'';
     councilState.last=entry;
     councilState.error='';
     showCouncil();
   };
 });
 if(!councilState.loadedHistory)loadCouncilHistory();
}
async function loadCouncilHistory(){
 const brain=window.Capacitor?.Plugins?.NovaBrain;
 if(!brain?.councilHistory)return;
 councilState.loadedHistory=true;
 try{
   const data=await brain.councilHistory();
   councilState.entries=Array.isArray(data.entries)?data.entries:[];
   if(document.querySelector('nav span.active')?.dataset.tab==='council')showCouncil();
 }catch(error){
   console.warn('История режиссёрского совета не загружена',error);
 }
}
function updateCouncilStage(stage){
 const node=document.getElementById('council-'+stage);
 if(node)node.textContent=councilState[stage] || '—';
}
async function startCouncil(){
 if(councilState.running||busy)return;
 const task=councilState.task.trim();
 if(!task||task.length>1200){
  councilState.error='Напиши задачу длиной до 1200 символов.';
  return showCouncil();
 }
 const brain=window.Capacitor?.Plugins?.NovaBrain;
 if(!brain?.directorCouncil){
  councilState.error='Эта версия APK не поддерживает режиссёрский совет.';
  return showCouncil();
 }
 councilState.running=true;
 busy=true;
 councilState.phase='';
 councilState.plan='';
 councilState.critic='';
 councilState.final='';
 councilState.last=null;
 councilState.error='';
 councilState.requestId='council-'+Date.now()+'-'+Math.random().toString(36).slice(2);
 showCouncil();
 let subscription=null;
 try{
   let status=await brain.status();
   if(status.engine!=='ModelReady'){
     await novaPrepareOnce();
     status=await brain.status();
     if(status.engine!=='ModelReady')
       throw new Error('Модель не готова: '+status.engine);
   }
   subscription=await brain.addListener('councilToken',event=>{
     if(event.requestId!==councilState.requestId)return;
     if(!Object.prototype.hasOwnProperty.call(councilLabels,event.stage))return;
     const changed=councilState.phase!==event.stage;
     councilState.phase=event.stage;
     councilState[event.stage]+=event.token||'';
     if(changed&&document.querySelector('nav span.active')?.dataset.tab==='council')showCouncil();
     updateCouncilStage(event.stage);
   });
   const response=await brain.directorCouncil({
     task,requestId:councilState.requestId
   });
   councilState.plan=response.plan||'';
   councilState.critic=response.critic||'';
   councilState.final=response.final||'';
   councilState.last=response;
   councilState.loadedHistory=false;
 }catch(error){
   councilState.error=error?.message||String(error);
 }finally{
   if(subscription)await subscription.remove().catch(e=>console.warn('NOVA',e));
   councilState.running=false;
   councilState.phase='';
   busy=false;
   if(document.querySelector('nav span.active')?.dataset.tab==='council')showCouncil();
 }
}
async function stopCouncil(){
 if(!councilState.running)return;
 try{
   const brain=window.Capacitor?.Plugins?.NovaBrain;
   await brain.cancelChat();
 }catch(error){
   councilState.error='Не удалось остановить генерацию: '+(error?.message||String(error));
   if(document.querySelector('nav span.active')?.dataset.tab==='council')showCouncil();
 }
}


let novaPreparePending = null;

async function novaPrepareOnce() {
  if (novaPreparePending) return novaPreparePending;

  const brain = window.Capacitor?.Plugins?.NovaBrain;
  if (!brain) throw new Error("NovaBrain недоступен");

  novaPreparePending = (async () => {
    const status = await brain.status();
    if (status.engine === "ModelReady")
      return {loaded:true};
    return await brain.prepare();
  })();

  try {
    return await novaPreparePending;
  } finally {
    novaPreparePending = null;
  }
}

async function novaAutoPrepare() {
  const brain = window.Capacitor?.Plugins?.NovaBrain;
  if (!brain) {
    console.warn('NOVA: Android-мост недоступен');
    return;
  }

  try {
    const status = await brain.status();

    if (status.engine === 'ModelReady') return;

    const result = await novaPrepareOnce();

    if (result.loaded) {
      console.log('NOVA: локальная модель готова');
    }
  } catch (error) {
    console.error('NOVA: ошибка запуска модели', error);
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', novaAutoPrepare);
} else {
  novaAutoPrepare();
}

</script>
</body>
</html>
