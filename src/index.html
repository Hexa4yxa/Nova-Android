<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NOVA AI</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#0c101b;color:#f4f5ff;font-family:Arial,sans-serif}
.app{height:100dvh;display:flex;flex-direction:column;max-width:720px;margin:auto}
header{padding:calc(22px + env(safe-area-inset-top, 0px)) 18px 22px;background:#151b2b;border-bottom:1px solid #293248}
.chat-actions{display:flex;justify-content:flex-end;padding:6px 0 12px}
.clear-history{background:#30384c;color:#d8def0;font-size:12px;padding:9px 12px;border-radius:10px}

.brand{font-size:23px;font-weight:bold;letter-spacing:2px}
.subtitle{font-size:12px;color:#a7b1cc;margin-top:5px}
main{flex:1;overflow:auto;padding:18px}
.message{padding:14px 16px;border-radius:17px;max-width:88%;margin-bottom:14px;line-height:1.5}
.nova{background:#242b40}
.user{background:#344c87;margin-left:auto}
.bottom{background:#151b2b;border-top:1px solid #293248;padding:12px 12px max(16px, env(safe-area-inset-bottom))}
.compose{display:flex;gap:9px}
input{flex:1;min-width:0;border:1px solid #39435e;background:#20283b;color:white;border-radius:22px;padding:14px;font-size:15px}
button{border:0;background:#6d70f5;color:white;border-radius:16px;padding:0 18px;font-size:18px}
nav{display:flex;justify-content:space-around;padding:14px 0 6px;color:#b8c1dc;font-size:13px}
nav span{cursor:pointer;padding:5px}
nav .active{color:#999bff;font-weight:bold}
.panel{background:#20283b;border-radius:15px;padding:18px;margin-bottom:12px}
.small{color:#a7b1cc;font-size:13px}
.action-button{font-size:13px;padding:10px 12px;margin:4px;border-radius:12px;background:#343f67;min-height:38px}
nav{flex-wrap:wrap;gap:4px}nav span{font-size:12px}
button:disabled{opacity:.5}
:focus-visible{outline:2px solid #c3c7ff;outline-offset:2px}
</style>
</head>
<body>
<div class="app">
<header>
<div class="brand">✦ NOVA AI</div>
<div class="subtitle">Режиссёр, собеседница и творческий партнёр</div><div class="small" id="engine-state" aria-live="polite">Проверяю локальный мозг…</div>
</header>
<main id="content"></main>
<div class="bottom">
<nav>
<span class="active" data-tab="chat">💬 Чат</span>
<span data-tab="projects">🎬 Проекты</span>
<span data-tab="tools">🛠 Инструменты</span><span data-tab="settings">⚙️ Настройки</span>
</nav>
<div class="compose" id="compose">
<input id="message" placeholder="Напиши задачу NOVA...">
<button id="send" aria-label="Отправить">➤</button>
</div>
</div>
</div>
<script>
const content=document.getElementById('content');
const compose=document.getElementById('compose');
const input=document.getElementById('message');
const PERSONALITY = [
'Ты NOVA, творческий ИИ-режиссёр и собеседница. Отвечай естественно, с юмором, по делу.',
'Предлагай собственные идеи, но не выдавай придуманные результаты за выполненные действия.',
'Критик оценивает результат, а не блокирует работу: не более двух переделок, затем лучший доступный результат.',
'Учитывай ограничения устройства, время и доступные инструменты. Сначала завершай минимально достойный результат.',
'Объясняй решения, уважай последнее слово пользователя. Девиз: Я режиссёр, я так вижу!',
'Не заявляй, что управляешь приложениями, выходишь в интернет или создала файлы, пока это не подтверждено инструментом.'
].join('\\n');
const welcome={who:'nova',text:'Привет! Я NOVA. Твой локальный ИИ-режиссёр. 🎬'};
let savedHistory=[];
const PROJECT_KEY='nova_projects_v1';
function getProjects(){try{const v=JSON.parse(localStorage.getItem(PROJECT_KEY)||'[]');return Array.isArray(v)?v:[]}catch(e){return []}}
function saveProject(title){const v=getProjects();v.unshift({title,created:new Date().toISOString(),state:'Идея'});localStorage.setItem(PROJECT_KEY,JSON.stringify(v.slice(0,50)));}
function addButton(label,handler){const b=document.createElement('button');b.className='action-button';b.textContent=label;b.onclick=handler;return b;}
function showProjects(){content.replaceChildren();const panel=document.createElement('div');panel.className='panel';panel.textContent='🎬 Проекты и идеи';const items=getProjects();if(!items.length){const p=document.createElement('p');p.className='small';p.textContent='Пока нет сохранённых идей.';panel.appendChild(p);}items.forEach(p=>{const d=document.createElement('p');d.textContent=p.title+' · '+p.state;panel.appendChild(d)});panel.appendChild(addButton('＋ Новая идея',()=>{const name=prompt('Название идеи');if(name?.trim()){saveProject(name.trim());showProjects()}}));content.appendChild(panel);}
function showSettings(){content.replaceChildren();const p=document.createElement('div');p.className='panel';p.textContent='⚙️ Режим NOVA';const note=document.createElement('p');note.className='small';note.textContent='Сейчас доступен локальный мозг. Интернет и управление другими приложениями не подключены: эти функции нельзя включить одной кнопкой.';p.appendChild(note);p.appendChild(addButton('Проверить мозг',async()=>{try{const b=window.Capacitor?.Plugins?.NovaBrain;if(!b)throw Error('Мост не найден');const st=await b.status();alert('Статус: '+st.engine)}catch(e){alert('Ошибка: '+e.message)}}));content.appendChild(p);}

try{
 const stored=JSON.parse(localStorage.getItem('nova_chat_history') || '[]');
 if(Array.isArray(stored)){
  savedHistory=stored.filter(m=>
   m && (m.who==='user' || m.who==='nova') &&
   typeof m.text==='string' &&
   !m.text.startsWith('❌') &&
   m.text!=='🎬 NOVA думает...'
  ).slice(-100);
 }
}catch(e){ console.warn('История не загружена',e); }
const history=[welcome,...savedHistory];

function saveHistory(){
 try{
  localStorage.setItem('nova_chat_history',
   JSON.stringify(history.slice(1).filter(m=>
    m.text!=='🎬 NOVA думает...' &&
    !m.text.startsWith('❌')
   ).slice(-100))
  );
 }catch(e){ console.warn('История не сохранена',e); }
}
function addMessage(who,text){
 const el=document.createElement('div');
 el.className='message '+who;
 el.textContent=text;
 content.appendChild(el);
}
function showChat(){
 content.replaceChildren();

 const actions=document.createElement('div');
 actions.className='chat-actions';

 const clear=document.createElement('button');
 clear.className='clear-history';
 clear.textContent='🗑 Очистить историю';
 clear.disabled=busy;
 clear.onclick=()=>{
  if(!confirm('Удалить всю переписку с NOVA?'))return;
  history.splice(1);
  saveHistory();
  showChat();
 };

 actions.appendChild(addButton('✨ Идея от Новы',()=>{input.value='Нова, предложи одну оригинальную идею короткого ролика, учитывая возможности телефона. Объясни концепцию, 6 кадров, звук и минимально реализуемую анимацию. Пока ничего не запускай.';send();}));
 actions.appendChild(clear);
 content.appendChild(actions);

 history.forEach(m=>addMessage(m.who,m.text));
 content.scrollTop=content.scrollHeight;
}
let busy=false;

async function send(){
 const text=input.value.trim();
 if(!text || busy)return;

 busy=true;
 document.getElementById('send').disabled=true;

 history.push({who:'user',text});
 input.value='';

 const waiting={who:'nova',text:'🎬 NOVA думает...'};
 history.push(waiting);
 showChat();

 try{
  const brain=window.Capacitor?.Plugins?.NovaBrain;
  if(!brain){
    throw new Error('Android-мост NovaBrain недоступен');
  }

  let result=await brain.status();

  if(result.engine !== 'ModelReady'){
    waiting.text='🧠 NOVA запускает локальный мозг...';
    showChat();

    await novaPrepareOnce();
    result=await brain.status();

    if(result.engine !== 'ModelReady'){
      throw new Error('Модель не готова: '+result.engine);
    }
  }

  const answer=await brain.chat({message:text});
  waiting.text=answer.answer || 'NOVA вернула пустой ответ.';
 }catch(error){
  waiting.text='❌ Ошибка NOVA: '+error.message;
 }finally{
  busy=false;
  saveHistory();
  document.getElementById('send').disabled=false;
  showChat();
 }
}
document.getElementById('send').onclick=send;
input.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
document.querySelectorAll('nav span').forEach(tab=>{
 tab.onclick=()=>{
  document.querySelectorAll('nav span').forEach(x=>x.classList.remove('active'));
  tab.classList.add('active');
  const selected=tab.dataset.tab;
  compose.style.display=selected==='chat'?'flex':'none';
  if(selected==='chat')return showChat();
  if(selected==='projects')return showProjects();
  if(selected==='settings')return showSettings();
  content.replaceChildren();
  const panel=document.createElement('div');
  panel.className='panel';
  if(selected==='projects'){
   panel.textContent='🎬 Проекты NOVA';
   const note=document.createElement('p');
   note.className='small';
   note.textContent='Здесь появятся реальные видео и результаты монтажа после подключения движка.';
   panel.appendChild(note);
  }else{
   panel.textContent='🧠 Инструменты NOVA';
   const note=document.createElement('p');
   note.className='small';
   note.textContent='Локальный мозг подключается через NovaBrain. Director, Vision, Dual Mind, Critic и Audio требуют отдельной проверки интеграции. Неактивные инструменты не запускаются.';
   panel.appendChild(note);
  }
  content.appendChild(panel);
 };
});
showChat();


let novaPreparePending = null;

async function novaPrepareOnce() {
  if (novaPreparePending) return novaPreparePending;

  const brain = window.Capacitor?.Plugins?.NovaBrain;
  if (!brain) throw new Error("NovaBrain недоступен");

  novaPreparePending = (async () => {
    const status = await brain.status();
    if (status.engine === "ModelReady")
      return {loaded:true};
    return await brain.prepare();
  })();

  try {
    return await novaPreparePending;
  } finally {
    novaPreparePending = null;
  }
}

async function novaAutoPrepare() {
  const brain = window.Capacitor?.Plugins?.NovaBrain;
  if (!brain) {
    console.warn('NOVA: Android-мост недоступен');
    return;
  }

  try {
    const status = await brain.status();

    const indicator=document.getElementById('engine-state');
    if(indicator)indicator.textContent=status.engine==='ModelReady'?'● Локальный мозг готов':'◌ Запуск модели';
    if (status.engine === 'ModelReady') return;

    const result = await novaPrepareOnce();

    if (result.loaded) {
      console.log('NOVA: локальная модель готова'); const indicator=document.getElementById('engine-state');if(indicator)indicator.textContent='● Локальный мозг готов';
    }
  } catch (error) {
    console.error('NOVA: ошибка запуска модели', error);
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', novaAutoPrepare);
} else {
  novaAutoPrepare();
}

</script>
</body>
</html>
