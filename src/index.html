<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NOVA AI</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#0c101b;color:#f4f5ff;font-family:Arial,sans-serif}
.app{height:100dvh;display:flex;flex-direction:column;max-width:720px;margin:auto}
header{padding:calc(22px + env(safe-area-inset-top, 0px)) 18px 22px;background:#151b2b;border-bottom:1px solid #293248}
.chat-actions{display:flex;justify-content:flex-end;padding:6px 0 12px}
.clear-history{background:#30384c;color:#d8def0;font-size:12px;padding:9px 12px;border-radius:10px}

.brand{font-size:23px;font-weight:bold;letter-spacing:2px}
.subtitle{font-size:12px;color:#a7b1cc;margin-top:5px}
main{flex:1;overflow:auto;padding:18px}
.message{padding:14px 16px;border-radius:17px;max-width:88%;margin-bottom:14px;line-height:1.5}
.nova{background:#242b40}
.user{background:#344c87;margin-left:auto}
.bottom{background:#151b2b;border-top:1px solid #293248;padding:12px 12px max(16px, env(safe-area-inset-bottom))}
.compose{display:flex;gap:9px}
input{flex:1;min-width:0;border:1px solid #39435e;background:#20283b;color:white;border-radius:22px;padding:14px;font-size:15px}
button{border:0;background:#6d70f5;color:white;border-radius:16px;padding:0 18px;font-size:18px}
nav{display:flex;justify-content:space-around;padding:14px 0 6px;color:#b8c1dc;font-size:13px}
nav span{cursor:pointer;padding:5px 1px;white-space:nowrap}
nav{font-size:11px;gap:4px}
.brain-row{padding:14px;margin:10px 0;border:1px solid #344059;border-radius:14px;background:#141c2d;line-height:1.5}
.brain-row button{margin-top:10px;padding:10px 14px;font-size:13px;min-height:42px}
.nova-more{margin:14px 0 2px;border-top:1px solid #38445f;padding-top:12px}
.nova-more summary{cursor:pointer;list-style:none;color:#c6ccff;font-weight:600;font-size:14px;padding:11px 0}
.nova-more summary::-webkit-details-marker{display:none}
.nova-more summary::before{content:"▸";margin-right:9px}
.nova-more[open] summary::before{content:"▾"}
.nova-more .brain-row{background:#161d30}
.nova-more .council-button{font-size:13px;padding:10px 14px;min-height:42px}
.brain-main-status{font-size:13px;color:#aab8d5;margin:4px 0 12px}
.brain-selected{font-size:16px;font-weight:600;overflow-wrap:anywhere}
.brain-caption{font-size:12px;color:#b6c1d6;overflow-wrap:anywhere;margin-top:5px}
.nova-download-progress{display:block;width:100%;height:9px;margin:10px 0 3px;accent-color:#888bff}
button:focus-visible,nav span:focus-visible{outline:2px solid #b4b7ff;outline-offset:3px}
@media(max-width:360px){.brand{font-size:19px;letter-spacing:1px}.panel{padding:14px}nav{font-size:10px}}
nav .active{color:#999bff;font-weight:bold}
.panel{background:#20283b;border-radius:15px;padding:18px;margin-bottom:12px}
.small{color:#a7b1cc;font-size:13px}
.council-input{width:100%;min-height:112px;resize:vertical;border:1px solid #39435e;background:#141c2d;color:white;border-radius:12px;padding:12px;font-size:15px;line-height:1.5}
.council-button{padding:12px 16px;font-size:14px;min-height:44px;margin:8px 7px 0 0}
.council-stop{background:#814453}
.council-stage{white-space:pre-wrap;overflow-wrap:anywhere;background:#141c2d;border-radius:12px;padding:12px;line-height:1.5;font-size:14px;min-height:48px}
.council-heading{font-size:15px;font-weight:bold;margin:8px 0}
.council-saved{display:block;width:100%;text-align:left;font-size:13px;padding:10px;margin:8px 0;background:#303b57;overflow-wrap:anywhere}
.council-check{font-size:13px;margin:7px 0;color:#cad4e8}
button:disabled{opacity:.45}
.nova-image-preview{display:block;max-width:100%;width:100%;max-height:480px;object-fit:contain;border-radius:12px;margin:12px auto 0}
.nova-image-status{white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0}
.nova-image-input{display:block;width:100%;min-height:96px;color:white;background:#141c2d;border:1px solid #39435e;border-radius:12px;padding:12px;resize:vertical}

.tool-input{display:block;width:100%;margin:8px 0 14px;padding:12px;color:#f4f5ff;background:#141c2d;border:1px solid #39435e;border-radius:10px;font-size:14px}
.tool-entry{background:#141c2d;border-radius:12px;padding:12px;margin:10px 0;overflow-wrap:anywhere}
.tool-actions{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.tool-actions button{padding:10px;font-size:13px;min-height:38px}
.tool-warning{font-size:12px;color:#c3bfd9;line-height:1.5}

</style>
</head>
<body>
<div class="app">
<header>
<div class="brand">✦ NOVA · DIRECTOR LAB</div>
<div class="subtitle">Локальные мозги · режиссёрский совет · инструменты</div>
</header>
<main id="content"></main>
<div class="bottom">
<nav>
<span class="active" data-tab="chat">💬 Чат</span>
<span data-tab="council">🎬 Совет</span>
<span data-tab="projects">📁 Проекты</span>
<span data-tab="brains">🧠 Мозги</span>
<span data-tab="tools">🧰 Руки</span>
</nav>
<div class="compose" id="compose">
<input id="message" placeholder="Напиши задачу NOVA...">
<button id="stop" aria-label="Остановить ответ" style="display:none">■</button>
<button id="send" aria-label="Отправить">➤</button>
</div>
</div>
</div>
<script src="nova_tool_registry.js"></script>
<script>
const content=document.getElementById('content');
const compose=document.getElementById('compose');
const input=document.getElementById('message');
const welcome={who:'nova',text:'Привет! Я NOVA. Твой локальный ИИ-режиссёр. 🎬'};
let savedHistory=[];
try{
 const stored=JSON.parse(localStorage.getItem('nova_chat_history') || '[]');
 if(Array.isArray(stored)){
  savedHistory=stored.filter(m=>
   m && (m.who==='user' || m.who==='nova') &&
   typeof m.text==='string' &&
   !m.text.startsWith('❌') &&
   m.text!=='🎬 NOVA думает...'
  ).slice(-100);
 }
}catch(e){ console.warn('История не загружена',e); }
const history=[welcome,...savedHistory];

function saveHistory(){
 try{
  localStorage.setItem('nova_chat_history',
   JSON.stringify(history.slice(1).filter(m=>
    m.text!=='🎬 NOVA думает...' &&
    !m.text.startsWith('❌')
   ).slice(-100).map(m=>({who:m.who,text:m.text})))
  );
 }catch(e){ console.warn('История не сохранена',e); }
}
function addMessage(who,text,preview){
 const el=document.createElement('div');
 el.className='message '+who;
 el.textContent=text;
 if(typeof preview==='string' && preview.startsWith('data:image/png;base64,') && preview.length<5000000){
  const img=document.createElement('img');
  img.src=preview;
  img.className='nova-image-preview';
  img.alt='Изображение, созданное NOVA';
  el.appendChild(img);
 }
 content.appendChild(el);
}
function showChat(){
 content.replaceChildren();

 const actions=document.createElement('div');
 actions.className='chat-actions';

 const clear=document.createElement('button');
 clear.className='clear-history';
 clear.textContent='🗑 Очистить историю';
 clear.disabled=busy;
 clear.onclick=()=>{
  if(!confirm('Удалить всю переписку с NOVA?'))return;
  history.splice(1);
  saveHistory();
  showChat();
 };

 actions.appendChild(clear);
 content.appendChild(actions);

 history.forEach(m=>addMessage(m.who,m.text,m.preview));
 content.scrollTop=content.scrollHeight;
}
let busy=false;

let awaitingImageDescription=false;
let imageBusy=false;
let imageLastResult=null;
let imagePromptDraft='';
const imageCommand=/^\s*(?:(?:нова|nova)\s*[,:]?\s+)?(?:(?:возьми|візьми)\s+и\s+)?(?:создай|сгенерируй|нарисуй|сделай|зроби|намалюй|згенеруй)\s+(?:мне\s+)?((?:(?:[а-яіїєґ-]+\s+){0,3})?)(?:картинку|изображение|фото|фотографию|кадр|малюнок|зображення)(?:\s*[:.,–-]?\s*|$)/iu;
const drawCommand=/^\s*(?:(?:нова|nova)\s*[,:]?\s+)?(?:(?:возьми|візьми)\s+и\s+)?(?:нарисуй|намалюй)\s+(.+)$/iu;

function imageRequest(text){
 const explicit=text.match(imageCommand);
 if(explicit){
   const extras=(explicit[1]||'').trim();
   const tail=text.slice(explicit[0].length).trim();
   return [extras,tail].filter(Boolean).join(', ');
 }
 const draw=text.match(drawCommand);
 return draw?draw[1].trim():null;
}

function imageNegativePrompt(prompt){
 const artistic=/(?:anime|аниме|мульт|cartoon|illustration|drawing|ілюстрац)/iu.test(prompt);
 return (artistic?'low quality, ugly, duplicate, incorrect proportions':
  'low quality, artificial skin, bad anatomy, deformed face, extra limbs')+
  ', color banding, posterization, neon colors, extreme saturation, distorted, blurry, text, watermark';
}
function imageEnhancedPrompt(raw){
 const anime=/(?:anime|аниме|cartoon|мульт|illustration|ілюстрац)/iu.test(raw);
 const detailed=/(?:photorealistic|realistic photography|cinematic lighting|detailed photo|35mm film|high detail)/iu.test(raw);
 if(anime||detailed)return raw.trim();
 return (raw.trim()+', photorealistic cinematic photograph, natural colors, balanced exposure, sharp focus, detailed textures').slice(0,590);
}
async function executeImageGeneration(prompt,onProgress=()=>{},size=512,stepCount=null){
 if(imageBusy)throw new Error('NOVA уже создаёт изображение.');
 const bridge=window.Capacitor?.Plugins?.NovaImage;
 if(!bridge)throw new Error('В этой APK ещё нет модуля NOVA Image.');
 imageBusy=true;
 let subscription=null;
 let imageReserved=false;
 const brain=window.Capacitor?.Plugins?.NovaBrain;
 try{
   onProgress('🔎 Проверяю локальный генератор...');
   const state=await bridge.status();
   if(!state.ready)throw new Error(state.detail||'Графическая модель не установлена в NOVA');
   if(!brain)throw new Error('Менеджер моделей NOVA недоступен.');
   // Optional fully offline visual scene planning while the text brain is loaded.
   // It never claims a finished image and falls back to the owner's wording.
   let visualPrompt=prompt;
   try{
    if(brain.planImagePrompt){
     onProgress('🎬 NOVA подготавливает описание сцены...');
     const plan=await brain.planImagePrompt({prompt:prompt.slice(0,500)});
     if(plan?.optimized && typeof plan.prompt==='string')visualPrompt=plan.prompt;
    }
   }catch(e){console.warn('NOVA prompt planner: original description used',e);}
   visualPrompt=imageEnhancedPrompt(visualPrompt).slice(0,590);
   onProgress('🧠 Освобождаю память для рисования...');
   await brain.releaseForImage();
   imageReserved=true;
   const startedAt=Date.now();
   const steps=Number.isInteger(stepCount)?stepCount:(size===256?8:12);
   subscription=await bridge.addListener('novaImageProgress',e=>{
     const total=e.total||steps;
     const minutes=Math.floor((Date.now()-startedAt)/60000);
     onProgress('🎨 NOVA рисует: '+(e.step||0)+' / '+total+' шагов · '+minutes+' мин. CPU, офлайн.');
   });
   onProgress('🎨 Создаю изображение · '+size+'×'+size+' · '+steps+' шагов. Первый запуск может быть долгим.');
   const result=await bridge.generate({
     prompt:visualPrompt,negative:imageNegativePrompt(visualPrompt),
     size,steps
   });
   result.elapsedSeconds=Math.round((Date.now()-startedAt)/1000);
   imageLastResult=result;
   imagePromptDraft=prompt;
   return result;
 }finally{
   try{await subscription?.remove();}catch(_){}
   // Cleanup if an error happened between text unload and native image start.
   if(imageReserved){
     try{await brain.finishImageWork();}
     catch(e){console.warn('NOVA: ошибка освобождения резерва RAM',e);}
   }
   imageBusy=false;
 }
}

async function handleImageMessage(text,requestedPrompt){
 busy=true;
 document.getElementById('send').disabled=true;
 history.push({who:'user',text});
 input.value='';
 const waiting={who:'nova',text:'🎨 NOVA готовит изображение...'};
 history.push(waiting);
 showChat();
 const prompt=requestedPrompt.trim();
 if(!prompt){
   awaitingImageDescription=true;
   waiting.text='Опиши, что нарисовать. Например: «тёмный лес в тумане, без людей». Если нет модели, добавь её во вкладке «Мозги».';
   busy=false;
   document.getElementById('send').disabled=false;
   showChat();
   saveHistory();
   return;
 }
 awaitingImageDescription=false;
 try{
   const quick=/(?:быстро|черновик|quick|draft|швидко|256)/iu.test(prompt);
   const size=quick?256:512;
   const result=await executeImageGeneration(prompt,status=>{
     waiting.text=status;
     if(document.querySelector('nav span.active')?.dataset.tab==='chat')showChat();
   },size);
   waiting.text='✅ NOVA создала изображение '+result.width+'×'+result.height+' в самой NOVA. Сохранено в Галерею → Pictures/NOVA.';
   waiting.preview=result.preview;
 }catch(error){
   waiting.text='⚠ Не удалось нарисовать: '+(error?.message||String(error));
 }finally{
   busy=false;
   document.getElementById('send').disabled=false;
   saveHistory();
   if(document.querySelector('nav span.active')?.dataset.tab==='chat')showChat();
 }
}

async function handleCapabilityMessage(text,route){
 busy=true;
 const button=document.getElementById('send');
 button.disabled=true;
 history.push({who:'user',text});
 input.value='';
 const waiting={who:'nova',text:'🧠 Проверяю инструменты NOVA...'};
 history.push(waiting);
 showChat();
 try{
  const registry=window.NovaToolRegistry;
  if(registry){
   waiting.text=await registry.describeCapability(route,window.Capacitor?.Plugins||{});
  }else if(route.tool==='image'){
   const image=window.Capacitor?.Plugins?.NovaImage;
   if(!image?.status)throw new Error('Графический модуль NOVA недоступен');
   const state=await image.status();
   waiting.text=state.ready?
    (state.testedOnDevice?
     'Да! Я уже создавала PNG прямо внутри NOVA. Напиши «Нарисуй тёмный лес в тумане» — запущу встроенный графический движок.':
     'Да, графический движок подключён. Напиши «Нарисуй тёмный лес в тумане», чтобы проверить создание PNG.') :
    'Генератор встроен, но модель пока не готова. '+(state.detail||'Открой вкладку «Мозги».');
  }else{
   throw new Error('Каталог возможностей NOVA недоступен');
  }
 }catch(error){
  waiting.text='⚠ Не удалось проверить инструмент: '+(error?.message||String(error));
 }finally{
  busy=false;
  button.disabled=false;
  saveHistory();
  if(document.querySelector('nav span.active')?.dataset.tab==='chat')showChat();
 }
}

async function send(){
 const text=input.value.trim();
 if(!text || busy)return;

 const imagePrompt=imageRequest(text);
 if(imagePrompt!==null || awaitingImageDescription){
  if(awaitingImageDescription && /^(отмена|скасувати|cancel)$/i.test(text)){
   awaitingImageDescription=false;
   history.push({who:'user',text});
   history.push({who:'nova',text:'Создание картинки отменено.'});
   input.value='';saveHistory();showChat();return;
  }
  await handleImageMessage(text,imagePrompt===null?text:imagePrompt);
  return;
 }

 // Never let Gemma invent where a completed image lives.
 if(/^(?:где\s*(?:она|картинка|изображение)?\??|де\s*(?:вона|картинка|зображення)?\??|покажи\s*(?:е[её]|картинку|результат)\??)$/iu.test(text) &&
    history.slice(-8).some(m=>m.who==='user' &&
     /(?:картин|изображени|рисов|нарис|малюн|зображенн)/iu.test(m.text||''))){
   history.push({who:'user',text});
   history.push({who:'nova',text:imageLastResult?.saved?
    'Вот результат — он сохранён в Галерее → Pictures/NOVA.':
    'Нет подтверждённого результата последней генерации. Проверь Галерею → Pictures/NOVA или повтори «Нарисуй…».',
    preview:imageLastResult?.saved?imageLastResult.preview:undefined});
   input.value='';saveHistory();showChat();return;
 }

 // NOVA, not Gemma, knows which native tools are installed and operational.
 // Capability questions must never be delegated to Gemma's guesses.
 // A minimal fallback remains available even if the registry script fails.
 const capability=window.NovaToolRegistry?.classifyCapability(text,history) ||
  (/(?:картин|изображени|фото|рисова|нарис|малюн|зображенн)/iu.test(text) &&
   /(?:\?|умеешь|можешь|умеєш|можеш|умеет|умеє|способна)/iu.test(text)
    ? {kind:'capability',tool:'image'} : null) ||
  (/(?:инструмент|інструмент|с помощью|за допомогою)/iu.test(text) &&
   history.slice(-6).some(m=>m.who==='user' &&
    /(?:картин|изображени|фото|рисова|нарис|малюн|зображенн)/iu.test(m.text||''))
    ? {kind:'capability',tool:'image'} : null);
 if(capability){
  await handleCapabilityMessage(text,capability);
  return;
 }

 busy=true;
 document.getElementById('send').disabled=true;

 history.push({who:'user',text});
 input.value='';

 const waiting={who:'nova',text:'🎬 NOVA думает...'};
 history.push(waiting);
 showChat();

 try{
  const brain=window.Capacitor?.Plugins?.NovaBrain;
  if(!brain){
    throw new Error('Android-мост NovaBrain недоступен');
  }

  let result=await brain.status();

  if(result.engine !== 'ModelReady'){
    waiting.text='🧠 NOVA запускает локальный мозг...';
    showChat();

    await novaPrepareOnce();
    result=await brain.status();

    if(result.engine !== 'ModelReady'){
      throw new Error('Модель не готова: '+result.engine+(result.detail?' — '+result.detail:''));
    }
  }

  const requestId='nova-'+Date.now()+'-'+Math.random().toString(36).slice(2);
  let streamed='';
  let stopped=false;
  const stopButton=document.getElementById('stop');
  const subscription=await brain.addListener('token',event=>{
    if(event.requestId!==requestId)return;
    streamed+=event.token || '';
    waiting.text=streamed || '🎬 NOVA думает...';
    if(document.querySelector('nav span.active')?.dataset.tab==='chat'){
      const nodes=content.querySelectorAll('.message.nova');
      if(nodes.length)nodes[nodes.length-1].textContent=waiting.text;
      content.scrollTop=content.scrollHeight;
    }
  });
  stopButton.style.display='inline-block';
  stopButton.disabled=false;
  stopButton.onclick=async()=>{
    stopped=true;
    stopButton.disabled=true;
    try{await brain.cancelChat();}
    catch(error){console.warn('NOVA: отмена не удалась',error);}
  };
  try{
    const answer=await brain.chat({message:text,requestId});
    waiting.text=answer.answer || streamed || (stopped?'Ответ остановлен.':'NOVA вернула пустой ответ.');
  }finally{
    stopButton.style.display='none';
    stopButton.onclick=null;
    await subscription.remove();
  }
 }catch(error){
  waiting.text='❌ Ошибка NOVA: '+error.message;
 }finally{
  busy=false;
  saveHistory();
  document.getElementById('send').disabled=false;
  showChat();
 }
}
document.getElementById('send').onclick=send;
input.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
document.querySelectorAll('nav span').forEach(tab=>{
 tab.onclick=()=>{
  document.querySelectorAll('nav span').forEach(x=>x.classList.remove('active'));
  tab.classList.add('active');
  const selected=tab.dataset.tab;
  compose.style.display=selected==='chat'?'flex':'none';
  if(selected==='chat')return showChat();
  if(selected==='council')return showCouncil();
   if(selected==='brains')return showBrainManager();
   if(selected==='tools')return showNovaTools();
  content.replaceChildren();
  const panel=document.createElement('div');
  panel.className='panel';
  if(selected==='projects'){
   panel.textContent='🎬 Проекты NOVA';
   const note=document.createElement('p');
   note.className='small';
   note.textContent='Здесь появятся реальные видео и результаты монтажа после подключения движка.';
   panel.appendChild(note);
  }else{
   panel.textContent='🧠 Инструменты NOVA';
   const note=document.createElement('p');
   note.className='small';
   note.textContent='Director Council и текстовый Critic: тестовый режим. Vision, монтаж и второй ИИ пока не подключены.';
   panel.appendChild(note);
   const diagnostics=document.createElement('p');
   diagnostics.className='small';
   diagnostics.textContent='🧠 Проверяю загруженную модель...';
   panel.appendChild(diagnostics);
   const brain=window.Capacitor?.Plugins?.NovaBrain;
   if(brain){
     brain.status().then(status=>{
       diagnostics.textContent='🧠 Модель: '+(status.model||'не загружена')+
         ' | Состояние: '+status.engine+
         (status.detail?' | '+status.detail:'');
     }).catch(error=>{diagnostics.textContent='Диагностика: '+error.message;});
   }else diagnostics.textContent='Диагностика недоступна';
  }
  content.appendChild(panel);
 };
});
showChat();




async function showBrainManager(){
 content.replaceChildren();
 const brain=window.Capacitor?.Plugins?.NovaBrain;
 const image=window.Capacitor?.Plugins?.NovaImage;
 const downloads=window.Capacitor?.Plugins?.NovaImageModels;
 const backup=window.Capacitor?.Plugins?.NovaModelBackup;
 const add=(parent,tag,cls,text)=>{
  const el=document.createElement(tag);
  if(cls)el.className=cls;
  if(text!==undefined)el.textContent=text;
  parent.appendChild(el);
  return el;
 };
 const llm=add(content,'section','panel');
 add(llm,'div','council-heading','🧠 Текст · Gemma / GGUF');

 async function refreshLLM(){
  modelsBox.replaceChildren();
  otherModelsBox.replaceChildren();
  exportBox.replaceChildren();
  if(!brain){llmState.textContent='⚠ Текстовый движок недоступен.';importBtn.disabled=true;return;}
  try{
   const data=await brain.listModels();
   const models=Array.isArray(data.models)?data.models:[];
   const primary=models.find(item=>item.active&&item.valid!==false)||
    models.find(item=>item.selected&&item.valid!==false)||
    models.find(item=>item.valid!==false)||models[0];
   const hiddenCount=models.length-(primary?1:0);
   llmMoreTitle.textContent='⚙ Другие модели и управление'+(hiddenCount?' · '+hiddenCount:'');
   llmState.textContent=data.loading?'🟡 Текстовый мозг загружается...':
    data.ready?'✅ Готов к разговору · офлайн':
    primary&&primary.valid!==false?'ℹ Модель есть, но ещё не загружена':
    '⚠ Нужна исправная GGUF для разговора';
   if(!models.length){
    add(modelsBox,'p','brain-caption','Текстовая модель ещё не добавлена.');
    llmMore.open=true;
   }
   for(const item of models){
    const valid=item.valid!==false;
    const main=item===primary;
    const row=add(main?modelsBox:otherModelsBox,'div','brain-row');
    add(row,'div',main?'brain-selected':'',(item.active?'✅ ':'')+(valid?'':'⚠ ')+(item.name||'GGUF'));
    add(row,'div','brain-caption',(Number(item.bytes)/1048576).toFixed(0)+' МБ · '+
     (!valid?'ошибка формата (сохранён без удаления)':item.active?'подключена':item.selected?'выбрана для запуска':'доступна'));
    if(!valid){
     add(row,'p','brain-caption','Файл не является корректной GGUF. Оставляем его без изменений.');
     continue;
    }
    if(!item.active){
     const select=add(row,'button','','🧠 Подключить');
     select.disabled=data.loading;
     select.onclick=async()=>{
      select.disabled=true;
      llmState.textContent='Загружаю модель...';
      try{await brain.activateSavedModel({id:item.id});await refreshLLM();}
      catch(e){llmState.textContent='⚠ '+(e?.message||String(e));select.disabled=false;}
     };
    }
    const exportBtn=add(main?exportBox:row,'button',main?'council-button':'','📁 Копировать GGUF в NOVA-Models');
    exportBtn.disabled=data.loading;
    exportBtn.onclick=async()=>{
     exportBtn.disabled=true;
     llmMore.open=true;
     llmState.textContent='Выбери Загрузки → NOVA-Models и нажми «Сохранить». Исходная модель останется в NOVA.';
     try{
      await brain.exportSavedModel({id:item.id});
      llmState.textContent='✅ Модель скопирована. Исходная GGUF сохранена.';
     }catch(e){llmState.textContent='⚠ Экспорт: '+(e?.message||String(e));}
     finally{exportBtn.disabled=false;}
    };
   }
   if(models.length && models.every(item=>item.valid===false)){
    llmMore.open=true;
    llmState.textContent='⚠ Исправной GGUF нет. Старые файлы не удалены, выбери работающую модель.';
   }
  }catch(e){llmState.textContent='⚠ '+(e?.message||String(e));}
 }
 async function refreshImages(){
  imagesBox.replaceChildren();
  imageOtherModelsBox.replaceChildren();
  resourceBox.replaceChildren();
  imageToolsBox.replaceChildren();
  if(!image){imageState.textContent='Встроенный движок изображений недоступен.';openDream.disabled=true;return;}
  try{
   const result=await image.imageModels();
   const models=Array.isArray(result.models)?result.models:[];
   const primary=models.find(item=>item.selected)||models[0];
   imageState.textContent=!result.installed?'⚠ Графический движок отсутствует в APK':
      primary?.testedOnDevice?'✅ Генератор работает · офлайн':
      models.length?'ℹ Модель загружена · первый тест PNG не выполнен':
      '⚠ Нет модели изображений — открой управление моделями';
   if(!models.length)imageMore.open=true;
   if(models.length){
    try{
     const resources=await image.status();
     const free=Number(resources.freeMemoryMib);
     if(Number.isFinite(free)&&free>=0){
      add(resourceBox,'p','brain-caption','💾 Свободно RAM: '+Math.floor(free)+' МиБ. Перед рисованием NOVA освобождает память текстовой модели.');
     }
     if(resources.resourceWarning){
      imageState.textContent+=' · ⚠ '+resources.resourceWarning;
     }
    }catch(error){console.warn('NOVA: проверка RAM недоступна',error);}
   }
   if(!models.length)add(imagesBox,'p','brain-caption','Встроенный генератор установлен. Для первого запуска нужна графическая модель SD 1.5. Ниже можно скачать проверенный вариант прямо в NOVA, без других приложений.');
   for(const item of models){
    const main=item===primary;
    const row=add(main?imagesBox:imageOtherModelsBox,'div','brain-row');
    add(row,'div',main?'brain-selected':'',(item.selected?'✅ ':'')+item.name);
    add(row,'div','brain-caption',(Number(item.bytes)/1048576).toFixed(0)+' МБ · '+(item.selected?'выбрана для автоматического запуска':'доступна')+(item.testedOnDevice?' · PNG успешно создан':item.validated?' · SHA-256 проверена, генерация ещё не проверена':' · генерация ещё не проверена'));
    if(item.lastError)add(row,'div','brain-caption','⚠ Последняя ошибка: '+item.lastError);
    if(item.selected && result.installed){
     const quickTest=add(imageToolsBox,'button','council-button','🧪 Проверить PNG · 256×256');
     quickTest.disabled=!!(result.generating||imageBusy);
     quickTest.onclick=async()=>{
      if(imageBusy)return;
      quickTest.disabled=true;
      imageTestStatus.textContent='🧠 Подготавливаю ресурсы NOVA для офлайн-теста...';
      const prompt='cinematic dark forest at night, soft moonlight, thick mist, realistic photography, no people';
      try{
       const answer=await executeImageGeneration(prompt,message=>{imageTestStatus.textContent=message;},256);
       imageTestStatus.textContent='✅ Первый PNG '+answer.width+'×'+answer.height+' создан внутри NOVA и сохранён в Галерею → Pictures/NOVA. Gemma загрузится при следующем сообщении.';
       imageTestPreview.replaceChildren();
       if(answer.preview){
        const img=add(imageTestPreview,'img','nova-image-preview');
        img.alt='Результат локального теста NOVA';
        img.src=answer.preview;
       }
       await refreshImages();
      }catch(error){
       imageTestStatus.textContent='⚠ Тест не завершился: '+(error?.message||String(error));
      }finally{quickTest.disabled=false;}
     };
    }
    if(!item.selected){
     const select=add(row,'button','','🎨 Выбрать');
     select.disabled=result.generating;
     select.onclick=async()=>{
      select.disabled=true;
      try{await image.selectImageModel({id:item.id});await refreshImages();}
      catch(e){imageState.textContent='⚠ '+(e?.message||String(e));select.disabled=false;}
     };
    }
   }
   // All downloads are initiated by a deliberate button press and verified before activation.
   downloadsBox.replaceChildren();
   if(downloads){
    const installed=await downloads.recommendedStatus();
    const row=add(downloadsBox,'div','brain-row');
    add(row,'div','','📦 Рекомендуемая SD 1.5 FP16 · 2,13 ГБ');
    const state=installed.state||'available';
    const received=Number(installed.received||0);
    const total=Number(installed.total)>0?Number(installed.total):Number(installed.approxBytes||2130000000);
    let detail='';
    if(state==='installed')detail='✅ Скачана, SHA-256 проверена, готова для использования внутри NOVA.';
    else if(state==='verifying')detail='🔎 Проверяю целостность и SHA-256 скачанной модели...';
    else if(state==='failed')detail='⚠ Android не завершил скачивание (код '+(installed.reason||'сети/хранилища')+'). Проверь Wi-Fi и свободное место, затем попробуй снова.';
    else if(state==='pending'||state==='downloading'||state==='paused'){
     const pct=total>0?Math.min(100,Math.floor(received/total*100)):0;
     detail=(state==='paused'?'⏸ Загрузка приостановлена системой. ':'⬇️ Скачивание: ')+
      pct+'% ('+(received/1048576).toFixed(0)+' / '+(total/1048576).toFixed(0)+' МБ).';
    }else detail='С официального каталога Comfy-Org (Hugging Face). CreativeML OpenRAIL-M. Только Wi-Fi, после установки — офлайн.';
    add(row,'div','brain-caption',detail);
    if(state==='paused'){
     add(row,'div','brain-caption','🔎 '+(installed.pauseExplanation||
      'Android остановил скачивание. Проверь доступ к Wi-Fi и разрешения для раздачи.'));
     if(!installed.hotspotDetected&&!installed.allowMeteredWifi)
      add(row,'div','brain-caption','При появлении подходящей безлимитной сети загрузка обычно продолжится автоматически. Не нужно удалять NOVA.');
    }
    if(['pending','downloading','paused'].includes(state)){
     const p=add(row,'progress','nova-download-progress');
     p.max=100;
     p.value=total>0?Math.max(0,Math.min(100,Math.floor(received/total*100))):0;
     p.setAttribute('aria-label','Скачивание модели: '+p.value+'%');
    }
    if(state==='failed'&&installed.error)add(row,'div','brain-caption','⚠ '+installed.error);
    if(state==='available'||state==='failed'||state==='not_found'){
     const hotspot=!!(installed.hotspotDetected&&installed.wifiConnected);
     const startDownload=add(row,'button','',hotspot?'📶 Скачать через раздачу Wi-Fi':'⬇️ Скачать 2,13 ГБ');
     if(hotspot)add(row,'div','brain-caption','Раздача другого телефона может расходовать его мобильный тариф. Перед загрузкой Android попросит подтверждение.');
     startDownload.onclick=async()=>{
      // Native dialog contains the final explicit approval.
      startDownload.disabled=true;
      try{await downloads.downloadRecommended({approved:true,allowMeteredWifi:hotspot});await refreshImages();}
      catch(e){imageState.textContent='⚠ '+(e?.message||String(e));startDownload.disabled=false;}
     };
    }
    // When another phone shares its mobile internet, Android often marks
    // the Wi-Fi as metered. The previous DownloadManager job must be
    // explicitly restarted with new constraints after owner approval.
    if(state==='paused'&&installed.wifiConnected&&!installed.allowMeteredWifi){
     add(row,'div','brain-caption','📶 Если используешь раздачу другого телефона, Android мог остановить загрузку из-за ограничений сети. Разреши загрузку через раздачу после подтверждения расхода трафика.');
     const permitHotspot=add(row,'button','','📶 Разрешить загрузку через раздачу');
     permitHotspot.onclick=async()=>{
      permitHotspot.disabled=true;
      imageState.textContent='Откроется системное подтверждение использования раздачи Wi-Fi.';
      try{await downloads.downloadRecommended({approved:true,allowMeteredWifi:true});await refreshImages();}
      catch(e){imageState.textContent='⚠ '+(e?.message||String(e));permitHotspot.disabled=false;}
     };
    }
    if(['pending','downloading','paused'].includes(state)){
     const cancelDownload=add(row,'button','','■ Отменить скачивание');
     cancelDownload.onclick=async()=>{
      if(!confirm('Остановить скачивание модели?'))return;
      cancelDownload.disabled=true;
      try{await downloads.cancelRecommended();await refreshImages();}
      catch(e){imageState.textContent='⚠ '+(e?.message||String(e));cancelDownload.disabled=false;}
     };
    }
   }
  }catch(e){imageState.textContent='⚠ '+(e?.message||String(e));}
 }
 importBtn.onclick=async()=>{

 if(backup){

   let listener=null;
   try{
    listener=await backup.addListener('novaModelRestoreProgress',event=>{
     const done=Number(event.copied||0)/1048576;
     const total=Number(event.total||0)/1048576;
     restoreStatus.textContent='♻️ Восстановление: '+done.toFixed(0)+' / '+total.toFixed(0)+' МиБ. Не закрывай приложение.';
    });

    restoreStatus.textContent=data.verified?
     '✅ Резервная копия проверена по SHA-256. Графический мозг подключён. Исходный файл сохранён.':
     '⚠ Восстановление не подтвердило целостность файла.';
    await refreshImages();
   }catch(error){
    restoreStatus.textContent='⚠ '+(error?.message||String(error))+' Резервная копия остаётся в Загрузках.';
   }finally{
    try{await listener?.remove();}catch(_){}
    restoreBackup.disabled=false;
   }
  };
 }
 refresh.onclick=async()=>{await Promise.all([refreshLLM(),refreshImages()]);};
 await Promise.all([refreshLLM(),refreshImages()]);
 // Refresh the download progress only while this tab is open.
 if(downloads){
  const timer=setInterval(()=>{
   if(!content.contains(imagePanel)){clearInterval(timer);return;}
   refreshImages().catch(error=>{imageState.textContent='⚠ '+(error?.message||String(error));});

 }
}

// Explicit-approval resource tools. No LLM text is ever executed as commands.
function renderNovaImageStudio(initialPrompt=''){
 const plugin=window.Capacitor?.Plugins?.NovaImage;
 const panel=document.createElement('section');
 panel.className='panel';
 function node(parent,tag,klass,label){
   const el=document.createElement(tag);
   if(klass)el.className=klass;
   if(label!==undefined)el.textContent=label;
   parent.appendChild(el);
   return el;
 }
 node(panel,'div','council-heading','🎨 NOVA Visual Studio — офлайн');
 node(panel,'p','tool-warning','Генерация внутри NOVA. Один раз добавь совместимую SD-модель через «Мозги». Local Dream и интернет не нужны.');
 const prompt=node(panel,'textarea','nova-image-input');
 prompt.placeholder='Опиши изображение. Для SD 1.5 лучше описание на английском.';
 prompt.value=initialPrompt||imagePromptDraft||'cinematic horror movie still, abandoned bathroom, eerie mirror, blue moonlight, dramatic shadows, realistic 35mm film';
 node(panel,'p','small','Готовые примеры на английском для лучшего понимания SD 1.5:');
 const presets=node(panel,'div','tool-actions');
 const presetValues=[
  ['👻 Зеркало без лица','cinematic horror film still, old bathroom mirror, human silhouette seen from behind, cold blue moonlight, mysterious reflection, dramatic shadows, realistic 35mm photography, no visible face'],
  ['🌲 Туманный лес','cinematic dark forest at night, thick mist, moonlight through the trees, wet ground, dramatic atmosphere, detailed realistic photography, no people'],
  ['🌙 Аниме','anime illustration, mysterious original girl in moonlit forest, gentle magical glow, expressive eyes, detailed background, clean line art, vibrant colors']
 ];
 for(const [title,description] of presetValues){
  const p=node(presets,'button','',title);
  p.onclick=()=>{prompt.value=description;imagePromptDraft=description;};
 }
 const sizeSelect=node(panel,'select','tool-input');
 sizeSelect.setAttribute('aria-label','Разрешение генерации');
 for(const [size,label] of [['256','Быстрая проверка · 256×256'],['512','Качественный кадр · 512×512']]){
  const option=node(sizeSelect,'option','',label);
  option.value=size;
 }
 sizeSelect.value='512';
 const stepsSelect=node(panel,'select','tool-input');
 stepsSelect.setAttribute('aria-label','Скорость и качество генерации');
 for(const [steps,label] of [
  ['8','⚡ Быстро · 8 шагов (черновик)'],
  ['12','⚖️ Баланс · 12 шагов (рекомендуется)'],
  ['24','💎 Качество · 24 шага (медленно, как раньше)']
 ]){
  const option=node(stepsSelect,'option','',label);
  option.value=steps;
 }
 stepsSelect.value='12';
 const controls=node(panel,'div','tool-actions');
 const openDream=node(controls,'button','','📂 Добавить модель в NOVA');
 const check=node(controls,'button','','🔎 Проверить');
 const generate=node(controls,'button','','🎨 Создать 512×512');
 sizeSelect.onchange=()=>{
  stepsSelect.value=sizeSelect.value==='256'?'8':'12';
  generate.textContent='🎨 Создать '+sizeSelect.value+'×'+sizeSelect.value;
 };
 const stop=node(controls,'button','','■ Остановить');
 stop.disabled=!imageBusy;
 const status=node(panel,'div','small nova-image-status','Проверяю встроенный движок NOVA. CPU · Галерея/Pictures/NOVA.');
 if(imageLastResult?.preview){
   const img=node(panel,'img','nova-image-preview');
   img.src=imageLastResult.preview;
   img.alt='Последняя созданная картинка';
 }
 content.appendChild(panel);
 if(!plugin){
   status.textContent='Для генерации нужна тестовая NOVA с модулем NovaImage.';
   check.disabled=true;generate.disabled=true;stop.disabled=true;openDream.disabled=true;
   return;
 }
 openDream.onclick=async()=>{
  openDream.disabled=true;
  status.textContent='Выбираю модель изображений с телефона...';
  try{
   await plugin.importImageModel();
   status.textContent='Модель импортирована. Нажми «Проверить».';
  }catch(e){status.textContent='⚠ '+(e?.message||String(e));}
  finally{openDream.disabled=false;}
 };
 check.onclick=async()=>{
   check.disabled=true;
   status.textContent='Проверяю встроенный графический движок NOVA...';
   try{
     const response=await plugin.status();
     status.textContent=(response.ready?(response.testedOnDevice?'✅ ':'ℹ '):'⚠ ')+(response.detail||'Нет данных')+
       (Number.isFinite(Number(response.freeMemoryMib))?'\nСвободно RAM: '+response.freeMemoryMib+' МиБ':'')+
       (response.resourceWarning?'\n⚠ Предварительная проверка: '+response.resourceWarning:'');
   }catch(e){status.textContent='⚠ '+(e?.message||String(e));}
   finally{check.disabled=false;}
 };
 generate.disabled=imageBusy;
 generate.onclick=async()=>{
   if(!prompt.value.trim()){status.textContent='Опиши будущий кадр.';return;}
   imagePromptDraft=prompt.value.trim();
   generate.disabled=true;
   stop.disabled=false;
   try{
     const result=await executeImageGeneration(imagePromptDraft,msg=>{status.textContent=msg;},Number(sizeSelect.value),Number(stepsSelect.value));
     status.textContent='✅ Готово! '+result.width+'×'+result.height+' · '+(result.elapsedSeconds||0)+' сек. Картинка сохранена в Галерею/Pictures/NOVA.';
     const old=panel.querySelector('.nova-image-preview');
     old?.remove();
     const img=node(panel,'img','nova-image-preview');
     img.src=result.preview;
     img.alt='Новая картинка NOVA';
   }catch(e){status.textContent='⚠ '+(e?.message||String(e));}
   finally{generate.disabled=false;stop.disabled=true;}
 };
 stop.onclick=async()=>{
   stop.disabled=true;
   try{await plugin.cancel();status.textContent='Остановка запрошена. Нативный движок заканчивает шаг.';}
   catch(e){status.textContent='⚠ '+e.message;}
 };
 // Check when this screen opens; avoid user having to press multiple diagnostic buttons.
 Promise.resolve().then(()=>{if(panel.isConnected && !imageBusy)check.onclick();});
}

async function showNovaTools(){
 content.replaceChildren();
 renderNovaImageStudio();
 const tools=window.Capacitor?.Plugins?.NovaTools;
 const panel=document.createElement('section');
 panel.className='panel';
 const add=(parent,tag,cls,value)=>{
   const node=document.createElement(tag);
   if(cls)node.className=cls;
   if(value!==undefined)node.textContent=value;
   parent.appendChild(node);
   return node;
 };
 add(panel,'div','council-heading','🧰 NOVA Tools — ресурсы');
 add(panel,'p','tool-warning','Загрузка только по твоему разрешению, с GitHub или Hugging Face. Модель продолжает работать офлайн. APK, скрипты и команды не запускаются.');
 const url=add(panel,'input','tool-input');
 url.placeholder='HTTPS-ссылка на ресурс (GitHub или Hugging Face)';
 url.setAttribute('aria-label','Ссылка HTTPS');
 const filename=add(panel,'input','tool-input');
 filename.placeholder='Имя файла, например nova-model.gguf';
 filename.setAttribute('aria-label','Имя файла');
 const sha=add(panel,'input','tool-input');
 sha.placeholder='SHA-256, если известен (необязательно)';
 sha.setAttribute('aria-label','Ожидаемый SHA-256');
 const actions=add(panel,'div','tool-actions');
 const start=add(actions,'button','','📥 Запросить загрузку');
 const refresh=add(actions,'button','','↻ Обновить');
 const note=add(panel,'p','small','Нова никогда не скачивает файл без отдельного подтверждения.');
 content.appendChild(panel);
 const list=add(content,'section','panel');
 add(list,'div','council-heading','📁 Загрузки NOVA');
 const entries=add(list,'div','');
 if(!tools){
   note.textContent='В этой версии APK инструменты ещё не подключены.';
   start.disabled=true;
   refresh.disabled=true;
   return;
 }
 const fmt=n=>!Number.isFinite(Number(n))||Number(n)<0?'?':(Number(n)/1048576).toFixed(1)+' МБ';
 async function reload(){
   entries.replaceChildren();
   add(entries,'p','small','Проверяю загрузки...');
   try{
     const result=await tools.downloads();
     entries.replaceChildren();
     const items=Array.isArray(result.items)?result.items:[];
     if(!items.length){add(entries,'p','small','Пока нет загрузок.');return;}
     for(const item of items){
       const row=add(entries,'div','tool-entry');
       add(row,'div','council-heading',item.name+' · '+item.status);
       add(row,'p','small','Источник: '+item.host+' · '+fmt(item.bytes)+' / '+fmt(item.total));
       if(item.reason!==undefined)add(row,'p','small','Код состояния Android: '+item.reason);
       const buttons=add(row,'div','tool-actions');
       if(item.status==='complete'){
         const verify=add(buttons,'button','','🔍 SHA-256');
         verify.onclick=async()=>{
           verify.disabled=true;
           try{
             const v=await tools.verifySha256({id:item.id});
             add(row,'p','tool-warning','SHA-256: '+v.sha256+' · '+(v.checksumProvided?(v.verified?'совпадает ✅':'НЕ СОВПАДАЕТ ⚠'):'нет эталонной суммы — подлинность не подтверждена'));
           }catch(e){note.textContent='Ошибка проверки: '+e.message;}
           finally{verify.disabled=false;}
         };
         const exportBtn=add(buttons,'button','','💾 Сохранить на телефон');
         exportBtn.onclick=async()=>{
           exportBtn.disabled=true;
           try{await tools.exportDownload({id:item.id});note.textContent='Файл сохранён в выбранное место.';}
           catch(e){note.textContent='Экспорт: '+e.message;}
           finally{exportBtn.disabled=false;}
         };
       }
       const remove=add(buttons,'button','','✕ Отменить / удалить');
       remove.onclick=async()=>{
         remove.disabled=true;
         try{await tools.cancelDownload({id:item.id});note.textContent='Загрузка удалена.';await reload();}
         catch(e){note.textContent='Отмена: '+e.message;remove.disabled=false;}
       };
     }
   }catch(e){entries.replaceChildren();add(entries,'p','small','Ошибка: '+e.message);}
 }
 start.onclick=async()=>{
   start.disabled=true;
   try{
     const response=await tools.requestDownload({
       url:url.value.trim(),filename:filename.value.trim(),sha256:sha.value.trim()
     });
     note.textContent='Загрузка '+response.name+' поставлена в очередь. Её прогресс отображается ниже и в уведомлениях Android.';
     await reload();
   }catch(e){note.textContent='Загрузка не начата: '+e.message;}
   finally{start.disabled=false;}
 };
 refresh.onclick=reload;
 await reload();
}

// Offline Director Council v1: three sequential roles using the ONE loaded model.
// All generated strings are written via textContent (no HTML from LLM).
let councilState={
 running:false, task:'', phase:'', plan:'', critic:'', final:'',
 last:null, error:'', entries:[], loadedHistory:false, requestId:''
};
const councilLabels={
 plan:'1/3 · NOVA — режиссёр',
 critic:'2/3 · Внутренний голос — второй взгляд',
 final:'3/3 · NOVA — итоговое решение'
};
function addCouncilElement(parent, tag, className, text){
 const el=document.createElement(tag);
 if(className)el.className=className;
 if(text!==undefined)el.textContent=text;
 parent.appendChild(el);
 return el;
}
function showCouncil(){
 content.replaceChildren();
 const shell=addCouncilElement(content,'section','panel');
 addCouncilElement(shell,'div','council-heading','🎬 Режиссёрский совет');
 addCouncilElement(shell,'p','small',
  'Тест: одна локальная Gemma играет три роли по очереди. Qwen и монтаж пока не подключены.');
 const editor=addCouncilElement(shell,'textarea','council-input');
 editor.id='council-task';
 editor.maxLength=1200;
 editor.placeholder='Например: ролик-ужас про зеркало, 35 секунд, без скримеров...';
 editor.value=councilState.task;
 editor.disabled=councilState.running;
 editor.oninput=()=>{councilState.task=editor.value;};
 const run=addCouncilElement(shell,'button','council-button','🎬 Обсудить идею');
 run.disabled=councilState.running;
 run.onclick=startCouncil;
 const stop=addCouncilElement(shell,'button','council-button council-stop','■ Остановить');
 stop.disabled=!councilState.running;
 stop.onclick=stopCouncil;
 const phaseLabel=councilState.running
   ? (councilLabels[councilState.phase] || 'Подготовка модели...')
   : (councilState.last?'Совет завершён. План сохранён на телефоне.':'Готова обсудить идею');
 addCouncilElement(shell,'p','small',phaseLabel);
 if(councilState.error) addCouncilElement(shell,'p','small','⚠ '+councilState.error);
 for(const [key,label] of Object.entries(councilLabels)){
   const panel=addCouncilElement(content,'section','panel');
   addCouncilElement(panel,'div','council-heading',label);
   const box=addCouncilElement(panel,'div','council-stage',councilState[key] || '—');
   box.id='council-'+key;
 }
 if(councilState.last){
   const checkPanel=addCouncilElement(content,'section','panel');
   addCouncilElement(checkPanel,'div','council-heading','🔍 Critic: проверка текстового плана');
   if(Array.isArray(councilState.last.checks)){
     councilState.last.checks.forEach(check=>{
       addCouncilElement(checkPanel,'div','council-check',
         (check.passed?'✓ ':'○ ')+check.label);
     });
   }else{
     addCouncilElement(checkPanel,'div','small',
       'Сохранено: '+(councilState.last.checksPassed||0)+
       ' из '+(councilState.last.checksTotal||4)+' текстовых признаков.');
   }
   addCouncilElement(checkPanel,'p','small',
     'Это только анализ текста. Кадры, монтаж и синхронизация звука здесь не проверялись.');
 }
 const historyPanel=addCouncilElement(content,'section','panel');
 addCouncilElement(historyPanel,'div','council-heading','📁 Сохранённые идеи');
 const entries=Array.isArray(councilState.entries)?councilState.entries:[];
 if(entries.length===0)addCouncilElement(historyPanel,'p','small','Здесь будут последние 8 законченных обсуждений.');
 entries.forEach((entry,index)=>{
   const button=addCouncilElement(historyPanel,'button','council-saved',
     (index+1)+'. '+(entry.task||'Без названия').slice(0,110));
   button.disabled=councilState.running;
   button.onclick=()=>{
     councilState.task=entry.task||'';
     councilState.plan=entry.plan||'';
     councilState.critic=entry.critic||'';
     councilState.final=entry.final||'';
     councilState.last=entry;
     councilState.error='';
     showCouncil();
   };
 });
 if(!councilState.loadedHistory)loadCouncilHistory();
}
async function loadCouncilHistory(){
 const brain=window.Capacitor?.Plugins?.NovaBrain;
 if(!brain?.councilHistory)return;
 councilState.loadedHistory=true;
 try{
   const data=await brain.councilHistory();
   councilState.entries=Array.isArray(data.entries)?data.entries:[];
   if(document.querySelector('nav span.active')?.dataset.tab==='council')showCouncil();
 }catch(error){
   console.warn('История режиссёрского совета не загружена',error);
 }
}
function updateCouncilStage(stage){
 const node=document.getElementById('council-'+stage);
 if(node)node.textContent=councilState[stage] || '—';
}
async function startCouncil(){
 if(councilState.running||busy)return;
 const task=councilState.task.trim();
 if(!task||task.length>1200){
  councilState.error='Напиши задачу длиной до 1200 символов.';
  return showCouncil();
 }
 const brain=window.Capacitor?.Plugins?.NovaBrain;
 if(!brain?.directorCouncil){
  councilState.error='Эта версия APK не поддерживает режиссёрский совет.';
  return showCouncil();
 }
 councilState.running=true;
 busy=true;
 councilState.phase='';
 councilState.plan='';
 councilState.critic='';
 councilState.final='';
 councilState.last=null;
 councilState.error='';
 councilState.requestId='council-'+Date.now()+'-'+Math.random().toString(36).slice(2);
 showCouncil();
 let subscription=null;
 try{
   let status=await brain.status();
   if(status.engine!=='ModelReady'){
     await novaPrepareOnce();
     status=await brain.status();
     if(status.engine!=='ModelReady')
       throw new Error('Модель не готова: '+status.engine);
   }
   subscription=await brain.addListener('councilToken',event=>{
     if(event.requestId!==councilState.requestId)return;
     if(!Object.prototype.hasOwnProperty.call(councilLabels,event.stage))return;
     const changed=councilState.phase!==event.stage;
     councilState.phase=event.stage;
     councilState[event.stage]+=event.token||'';
     if(changed&&document.querySelector('nav span.active')?.dataset.tab==='council')showCouncil();
     updateCouncilStage(event.stage);
   });
   const response=await brain.directorCouncil({
     task,requestId:councilState.requestId
   });
   councilState.plan=response.plan||'';
   councilState.critic=response.critic||'';
   councilState.final=response.final||'';
   councilState.last=response;
   councilState.loadedHistory=false;
 }catch(error){
   councilState.error=error?.message||String(error);
 }finally{
   if(subscription)await subscription.remove().catch(e=>console.warn('NOVA',e));
   councilState.running=false;
   councilState.phase='';
   busy=false;
   if(document.querySelector('nav span.active')?.dataset.tab==='council')showCouncil();
 }
}
async function stopCouncil(){
 if(!councilState.running)return;
 try{
   const brain=window.Capacitor?.Plugins?.NovaBrain;
   await brain.cancelChat();
 }catch(error){
   councilState.error='Не удалось остановить генерацию: '+(error?.message||String(error));
   if(document.querySelector('nav span.active')?.dataset.tab==='council')showCouncil();
 }
}


let novaPreparePending = null;

async function novaPrepareOnce() {
  if (novaPreparePending) return novaPreparePending;

  const brain = window.Capacitor?.Plugins?.NovaBrain;
  if (!brain) throw new Error("NovaBrain недоступен");

  novaPreparePending = (async () => {
    const status = await brain.status();
    if (status.engine === "ModelReady")
      return {loaded:true};
    return await brain.prepare();
  })();

  try {
    return await novaPreparePending;
  } finally {
    novaPreparePending = null;
  }
}

async function novaAutoPrepare() {
  // Tools Lab must be usable without duplicating the user's large GGUF.
  // Chat and Council already call novaPrepareOnce() on demand.
  if (window.Capacitor?.Plugins?.NovaTools) return;
  const brain = window.Capacitor?.Plugins?.NovaBrain;
  if (!brain) {
    console.warn('NOVA: Android-мост недоступен');
    return;
  }

  try {
    const status = await brain.status();

    if (status.engine === 'ModelReady') return;

    const result = await novaPrepareOnce();

    if (result.loaded) {
      console.log('NOVA: локальная модель готова');
    }
  } catch (error) {
    console.error('NOVA: ошибка запуска модели', error);
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', novaAutoPrepare);
} else {
  novaAutoPrepare();
}
