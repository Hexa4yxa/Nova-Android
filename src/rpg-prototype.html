l.current{background:#527849;border-color:#aed29d;color:white;font-weight:700}.pill{font-size:11px;border:1px solid #647e69;padding:4px 7px;border-radius:20px}.divider{height:1px;background:#33493a;margin:14px 0}.travel{min-height:155px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}.spinner{height:30px;width:30px;border:3px solid #3a5444;border-top-color:#b3d5ab;border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.footer{margin:17px 0 4px;font-size:11px;color:#8fa495;line-height:1.5}.help{font-size:12px;color:#c2d1c1}.hint{color:#f0d19a}.up{font-size:12px;color:#a6dca3}.notice{font-size:12px;color:#f4c09d}.mutebtn{font-size:12px;padding:7px;min-height:35px}@media(min-width:540px){.scene{height:236px}.actions{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style></head><body><div class="wrap"><div class="header"><div><div class="brand">✦ СИСТЕМА: ОШИБКА ПРИЗЫВА</div><div class="quiet">Глава I · игровая версия 0.2 · офлайн</div></div><div class="tag" id="lvl">Ур. 1</div></div><div class="scene" id="scene"><div class="scenetext"><div class="eyebrow" id="eyebrow">День 1</div><h1 id="location">Пробуждение</h1><div class="quiet" id="locationSub"></div></div></div><div class="cards"><div class="stat"><div class="quiet">❤ Здоровье</div><strong id="hp"></strong><div class="meter"><i id="hpbar"></i></div></div><div class="stat"><div class="quiet">⚡ Силы</div><strong id="st"></strong><div class="meter"><i id="stbar"></i></div></div><div class="stat"><div class="quiet">✦ Опыт</div><strong id="xp"></strong><div class="meter"><i id="xpbar"></i></div></div></div><div class="tabs"><button data-tab="world" class="on">🌲 Мир</button><button data-tab="hero">🧍 Герой</button><button data-tab="journal">📜 Журнал</button></div><main id="main" aria-live="polite"></main><div class="footer">Сохранение локальное. ИИ-модель и озвучка пока не подключены: Система использует игровой сценарий. Отсчёт дороги можно пропустить. Сброс сохранения — в Журнале.</div></div>
<script>
(()=>{'use strict';
const KEY='nova_rpg_v02', OLD='nova_rpg_prototype_01';
const spots=[
 {n:'Место пробуждения',d:'Мокрый мох, чужое небо и телефон без сети. Система приветствует вас так, словно это её обычный понедельник.',ex:[1,2],a:'intro',v:'forest'},
 {n:'Развилка',d:'Три дороги расходятся под мрачными деревьями. На стволах — старые метки. Неплохое место, чтобы окончательно потеряться.',ex:[0,3,4],a:'mark',v:'forest'},
 {n:'Холодный ручей',d:'Зеркальная вода и странная зелёная трава. Пить ли воду неизвестного мира? Даже Система сомневается.',ex:[0,5],a:'herb',v:'creek'},
 {n:'Мшистый поворот',d:'В густых кустах кто-то тяжело дышит. На земле — свежие следы когтей.',ex:[1,6],a:'enemy1',v:'forest'},
 {n:'Глухая чаща',d:'Под папоротником блестит металл. Кто-то потерял здесь оружие или что-то гораздо важнее.',ex:[1,7],a:'shard',v:'forest'},
 {n:'Грибная поляна',d:'Багряные цветы растут кольцом. Их аромат кажется необычно сладким.',ex:[2,8],a:'flower',v:'creek'},
 {n:'Старый мост',d:'Деревянный мост стонет над оврагом. На противоположной стороне мерцает слабый огонёк.',ex:[3,9],a:'mark',v:'road'},
 {n:'Логово падальщика',d:'Рядом со свёртком костей слышится неприятное рычание. Возможно, добыча здесь одна — это вы.',ex:[4,10],a:'enemy2',v:'forest'},
 {n:'Заброшенная стоянка',d:'Старый навес и угли чужого костра. Отдохнуть можно, но запасы еды не бесконечны.',ex:[5,9,11],a:'camp',v:'camp'},
 {n:'Перекрёсток',d:'Грязная дорога, разбойничьи следы и почти стёртый указатель в сторону деревни.',ex:[6,8,10],a:'enemy3',v:'road'},
 {n:'Повозка торговца',d:'Седой мужчина оценивает вас взглядом. По его лицу видно: бесплатной легендарной экипировки не будет.',ex:[7,9,11],a:'merchant',v:'road'},
 {n:'Граница леса',d:'Впереди первые крыши неизвестной деревни. А под ними, вероятно, первые серьёзные неприятности.',ex:[8,10],a:'final',v:'road'}
];
const enemies={enemy1:{name:'Лесной падальщик',hp:20,power:4,xp:13,coins:3,pattern:['Ноги','Корпус','Голова'],blocks:['Корпус','Голова','Ноги']},enemy2:{name:'Голодный зверь',hp:29,power:6,xp:18,coins:5,pattern:['Ноги','Ноги','Голова'],blocks:['Голова','Корпус','Корпус']},enemy3:{name:'Дорожный разбойник',hp:33,power:7,xp:24,coins:7,pattern:['Голова','Корпус','Ноги'],blocks:['Корпус','Ноги','Голова']}};
const maxHp=()=>40+g.stats.end*5,maxSt=()=>25+g.stats.end*3,needXp=()=>20+(g.level-1)*12;
function fresh(){return {version:2,pos:0,level:1,xp:0,points:0,hp:55,st:34,stats:{str:3,agi:3,luck:3,end:3},coins:0,items:{'Сухарь':1},gear:'Кулаки',visited:[0],resolved:{},discovered:[],known:[],notes:[],marks:[],flags:{},wins:0,losses:0,minutes:8*60,day:1,shop:{knife:1,bread:2},battle:null,systemCalls:0,lastSystem:[],lines:['Вы проснулись в чужом мире. Уровень 1. Ни магии, ни меча, ни инструкции.']}};
function migrate(v){const n=fresh();if(!v||!v.stats||!Array.isArray(v.visited))return n;for(const k of ['pos','level','xp','points','coins','wins','losses','systemCalls'])if(Number.isFinite(v[k]))n[k]=v[k];for(const k of Object.keys(n.stats))if(Number.isFinite(v.stats[k]))n.stats[k]=Math.max(1,Math.min(70,v.stats[k]));n.pos=spots[n.pos]?n.pos:0;n.level=Math.max(1,Math.min(50,n.level));n.visited=Array.from(new Set(v.visited.filter(i=>spots[i])));n.visited.push(n.pos);n.visited=Array.from(new Set(n.visited));n.items=v.items&&typeof v.items==='object'?v.items:n.items;n.gear=v.gear||'Кулаки';n.discovered=Array.isArray(v.discoveries)?v.discoveries:[];n.notes=Array.isArray(v.notes)?v.notes:[];n.marks=Array.isArray(v.marks)?v.marks:[];n.hp=Math.max(1,Math.min(40+n.stats.end*5,v.hp||55));n.st=Math.max(0,Math.min(25+n.stats.end*3,v.st||34));if(n.items['Потрёпанный нож'])n.shop.knife=0;for(const id of v.foes||[])if(id in enemies)n.resolved[id]=true;if(v.wins>0){n.flags.oldWins=true;/* Нельзя точно восстановить, каких врагов победили в старом сохранении. */n.resolved.enemy1=true;n.resolved.enemy2=true;n.resolved.enemy3=true;}
n.lines.unshift('Прогресс v0.1 перенесён. Побеждённые враги в старом сохранении заблокированы от повторного фарма.');return n}
function load(){try{let v=JSON.parse(localStorage.getItem(KEY));if(v&&v.version===2&&v.stats)return v;const o=JSON.parse(localStorage.getItem(OLD));if(o){const m=migrate(o);localStorage.setItem(KEY,JSON.stringify(m));return m}}catch(e){/* localStorage недоступен — игра остаётся сессионной */}return fresh()}
let g=load(),tab='world',travel=null,travelTimer=null,attack='Голова',defend='Корпус',mode='Быстрый';
function save(){try{localStorage.setItem(KEY,JSON.stringify(g))}catch(e){console.warn('Save failed',e)}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function button(s,a,cl='',disabled=false){return `<button data-action="${esc(a)}" class="${cl}" ${disabled?'disabled':''}>${esc(s)}</button>`}
function log(s){g.lines.unshift(s);g.lines.length=Math.min(35,g.lines.length)}
function speak(s,forced=false){if(!forced&&Math.random()>.65)return;if(g.lastSystem.includes(s))return;g.lastSystem.unshift(s);g.lastSystem=g.lastSystem.slice(0,5);log('✦ Система: '+s)}
const jokes={travel:['Дорога снова раздваивается. Возможно, местный архитектор получал зарплату за повороты.','Дерево слева подозрительно похоже на дерево справа. Впечатляющее разнообразие.','Ваш навигатор не отвечает. Я бы тоже не отвечала, если бы знала, где мы.','Прогулка полезна для здоровья. Если никто не пытается вас съесть.'],enemy:['У врага оружие. У вас энтузиазм. Силы примерно равны. Нет, не равны.','Могу предложить мирное решение. Но по его взгляду переговоры уже завершились.'],merchant:['Он продаёт нож. Удивительно, как хорошо монеты мотивируют местных жителей.','Не скупайте весь товар. Судя по бюджету, мы здесь не в отпуске.'],low:['У нас мало здоровья. Предлагаю временно прекратить коллекционировать удары.','В следующий раз попробуйте уклоняться до того, как вас ударили.']};
function randomLine(type){const a=jokes[type]||jokes.travel;const choices=a.filter(x=>!g.lastSystem.includes(x));speak(choices[Math.floor(Math.random()*choices.length)]||a[0],true)}
function grow(){let limit=needXp();while(g.xp>=limit&&g.level<50){g.xp-=limit;g.level++;g.points+=2;/* Левелап не лечит */log(`Уровень ${g.level}: +2 очка характеристик.`);speak(g.level===10?'Анализ растений разблокирован! Наконец-то я могу отличить лечебную траву от очень плохого салата.':'Ещё один уровень. И ни единого предложения о бесплатной магии.',true);limit=needXp()}}
function gain(n){g.xp+=n;grow()}
function firstVisit(i){if(!g.visited.includes(i)){g.visited.push(i);gain(3);log(`Открыта локация: ${spots[i].n}. +3 опыта.`);if(i===8)speak('Навес! Отлично. В этом мире впервые обнаружен объект, который не пытается нас убить.',true);if(i===10)speak('Вижу торговца. Пожалуйста, не пытайтесь выменять у него телефон без зарядки.',true)}}
function startMove(i){if(g.battle||travel||!spots[g.pos].ex.includes(i))return;const lines=['Вдалеке хрустят ветки.','Ветер шуршит в кронах.','На тропе замечены чужие следы.','Кажется, кто-то следит из зарослей.','Пахнет мокрой корой и дымом.'];travel={target:i,detail:lines[Math.floor(Math.random()*lines.length)]};tab='world';render();travelTimer=setTimeout(finishMove,3400)}
function finishMove(){if(!travel)return;const i=travel.target;clearTimeout(travelTimer);travelTimer=null;travel=null;g.pos=i;g.minutes+=15;g.st=Math.min(maxSt(),g.st+2);if(g.minutes>=24*60){g.minutes-=24*60;g.day++;}firstVisit(i);if(g.level<10&&g.visited.length%3===0)randomLine('travel');if(i===3&&!g.flags.firstThreat){g.flags.firstThreat=true;speak('Там что-то есть. Рекомендую сначала посмотреть, потом изображать великого воина.',true)}save();render()}
function inspect(){if(g.battle||travel)return;const here=spots[g.pos];switch(here.a){case 'herb':pickup('herb','Зелёная трава','Вы подобрали неизвестную траву.');break;case 'flower':pickup('flower','Багряный цветок','Вы сорвали багряный цветок. Запах подозрительно сладкий.');break;case 'shard':pickup('shard','Металлический осколок','Вы нашли острый металлический осколок.');break;case 'enemy1':case 'enemy2':case 'enemy3':if(g.resolved[here.a]){log('Здесь больше нет противника. Следы старого боя ещё видны.');speak('Убитые противники не восстанавливаются по нажатию кнопки. Какое разочарование.',true)}else if(!g.battle)startFight(here.a,false);break;case 'merchant':log('Торговец кивает и поправляет нож на поясе.');break;case 'camp':log('Лагерь безопасен, но для долгого отдыха нужен припас.');break;case 'final':if(!g.resolved.final){g.resolved.final=true;gain(2);log('Граница леса достигнута. Глава II пока недоступна. +2 опыта.');speak('Поздравляю. Мы нашли цивилизацию. Теперь предстоит выяснить, опаснее ли она леса.',true)}else log('Вы уже обнаружили дорогу в деревню.');break;default:if(!g.marks.includes(g.pos)){g.marks.push(g.pos);gain(2);log('Вы оставили метку на дереве. +2 опыта.')}else log('Эта метка уже есть. Мы снова смотрим на ту же кору.')}
save();render()}
function pickup(tag,item,msg){if(g.discovered.includes(tag)){log('Всё ценное здесь уже собрано.');return}g.discovered.push(tag);g.items[item]=(g.items[item]||0)+1;gain(4);log(msg+' +4 опыта.');if(g.level<10)speak('Мой научный вывод: перед нами растение. Да, аналитика впечатляет.',true);else if(tag==='herb')speak('Это сердцелистная трава. Пригодится для лечения.',true);else if(tag==='flower')speak('Багряный цветок ядовит. Только не делайте из него чай.',true)}
function rest(){if(g.battle||travel||g.pos!==8)return;if(g.hp>=maxHp()&&g.st>=maxSt()){log('Вы и так отдохнули. Не обязательно подражать профессиональному лежебоке.');render();return}if(!(g.items['Сухарь']>0)){log('Для безопасного отдыха не хватает еды. У торговца можно купить сухарь.');render();return}g.items['Сухарь']--;g.minutes+=120;g.hp=Math.min(maxHp(),g.hp+Math.round(maxHp()*.5));g.st=maxSt();if(g.minutes>=24*60){g.minutes-=24*60;g.day++;}log('Два игровых часа отдыха. Израсходован сухарь. Здоровье и силы восстановлены частично.');speak('Впечатляюще. Лежать оказалось эффективнее, чем ловить удары лицом.',true);save();render()}
function startFight(id,ambush){if(g.battle||travel||g.resolved[id])return;const t=enemies[id];if(!t)return;let bonus=0;if(ambush){const chance=Math.min(.75,.13+(g.stats.agi-3)*.07);if(Math.random()<chance){bonus=4+g.stats.agi;log(`Засада успешна! ${t.name} застигнут врасплох.`);speak('Не могу поверить. Мы действительно сделали это тихо.',true)}else{g.st=Math.max(0,g.st-2);log('Засада провалилась: сухая ветка хрустнула под ногой. −2 выносливости.');speak('Скрытность: три. Громкость: девять. У противника отличные уши.',true)}}g.battle={id,hp:Math.max(1,t.hp-bonus),max:t.hp,turn:1,lastTarget:null};log(`Начался бой: ${t.name}.`);if(!ambush)randomLine('enemy');tab='world';save();render()}
function enemyIntent(b){const e=enemies[b.id];const idx=(b.turn-1)%e.pattern.length;return {hit:e.pattern[idx],block:b.lastTarget&&b.turn%2===0?b.lastTarget:e.blocks[idx]}}
const hints={Голова:'Противник заносит оружие над плечом. Вероятен удар в голову.',Корпус:'Противник переносит вес вперёд. Вероятен удар по корпусу.',Ноги:'Противник пригибается и смотрит вниз. Вероятен удар по ногам.'};
function damageEnemy(b,amount){b.hp=Math.max(0,b.hp-amount)}
function finishBattle(b){const t=enemies[b.id];g.resolved[b.id]=true;g.battle=null;g.wins++;g.coins+=t.coins;gain(t.xp);log(`Победа над ${t.name}. +${t.xp} опыта, +${t.coins} монет. Повторной награды здесь не будет.`);speak('Враг повержен. Я почти уверена, что это было предусмотрено планом.',true)}
function loseBattle(){g.losses++;g.battle=null;g.pos=8;firstVisit(8);g.hp=Math.min(maxHp(),18);g.st=Math.min(maxSt(),10);g.coins=Math.max(0,g.coins-2);g.minutes+=60;log('Поражение. Вас нашли у стоянки. Потеряно до 2 монет и час игрового времени.');speak('Вы выжили. Я бы назвала это неудачной победой, но словарь возражает.',true)}
function fight(){if(!g.battle||travel)return;const b=g.battle,e=enemies[b.id],intent=enemyIntent(b);const price=mode==='Силовой'?6:mode==='Финт'?4:0;if(g.st<price){log('Недостаточно выносливости для этого приёма.');render();return}let dmg=0;if(mode==='Защита'){g.st=Math.min(maxSt(),g.st+6);log('Вы приняли защитную стойку и восстановили 6 единиц выносливости.')}else{g.st=Math.max(0,g.st-price);dmg=3+g.stats.str+Math.floor(Math.random()*3);if(g.gear==='Потрёпанный нож')dmg+=3;if(mode==='Быстрый')g.st=Math.min(maxSt(),g.st+1);if(mode==='Силовой')dmg=Math.round(dmg*1.55);if(mode==='Финт')dmg+=2;if(attack===intent.block)dmg=Math.max(1,Math.floor(dmg*(mode==='Финт'?.9:.3)));damageEnemy(b,dmg);log(`Вы бьёте: ${attack.toLowerCase()}. ${dmg} урона. Защита врага: ${intent.block.toLowerCase()}.`)}b.lastTarget=attack;
if(b.hp<=0){finishBattle(b);save();render();return}
let incoming=e.power+Math.floor(Math.random()*3);if(intent.hit===defend)incoming=Math.max(1,Math.floor(incoming*.3));if(mode==='Защита')incoming=Math.max(1,Math.floor(incoming*.45));g.hp=Math.max(0,g.hp-incoming);log(`${e.name} атакует ${intent.hit.toLowerCase()}: −${incoming} HP.`);b.turn++;if(g.hp===0)loseBattle();else if(g.hp<15&&b.turn%2===0)randomLine('low');save();render()}
function flee(){if(!g.battle||travel)return;const p=.45+Math.min(.3,Math.max(0,(g.stats.agi-3)*.055));if(Math.random()<p){g.battle=null;log('Удалось скрыться. Противник остаётся в этой локации.');speak('Отступление — тоже стратегия. Особенно когда стратегия «вперёд» не работает.',true)}else{const d=4;g.hp=Math.max(1,g.hp-d);log(`Побег сорвался. −${d} HP. Враг ждёт следующего раунда.`)}save();render()}
function buy(item){if(g.pos!==10||g.battle)return;const table={knife:{n:'Потрёпанный нож',p:6},bread:{n:'Сухарь',p:3}};const t=table[item];if(!t)return;if(g.shop[item]<=0){log('Товар у торговца закончился.');render();return}if(g.coins<t.p){log(`Нужно ${t.p} монет. У вас только ${g.coins}.`);render();return}if(item==='knife'&&g.items['Потрёпанный нож']>=1){log('У вас уже есть нож. Продавец удивлён вашей коллекцией.');speak('Два одинаковых ножа? Напомнить, сколько у вас рук?',true);render();return}g.coins-=t.p;g.shop[item]--;g.items[t.n]=(g.items[t.n]||0)+1;log(`Куплено: ${t.n} за ${t.p} монеты. В наличии осталось ${g.shop[item]}.`);if(item==='knife')randomLine('merchant');save();render()}
function sell(item){if(g.pos!==10||g.battle)return;const table={herb:{n:'Зелёная трава',p:4},shard:{n:'Металлический осколок',p:3}};const t=table[item];if(!t||!(g.items[t.n]>0)){log('Нет подходящего товара.');render();return}g.items[t.n]--;g.coins+=t.p;if(item==='herb'&&!g.known.includes('herb'))g.known.push('herb');log(`Продано: ${t.n}. +${t.p} монеты.`);if(item==='herb')log('Торговец: «Это сердцелистная трава. Алхимики делают из неё лечебные составы».');save();render()}
function equip(){if(!g.items['Потрёпанный нож']){log('Ножа нет в рюкзаке.');render();return}if(g.stats.str<4||g.stats.agi<4){log('Для ножа нужны сила 4 и ловкость 4.');render();return}g.gear='Потрёпанный нож';log('Потрёпанный нож экипирован.');save();render()}
function boost(k){if(!(k in g.stats)||g.points<1)return;const oldHp=maxHp(),oldSt=maxSt();g.points--;g.stats[k]++;g.hp=Math.min(maxHp(),g.hp+maxHp()-oldHp);g.st=Math.min(maxSt(),g.st+maxSt()-oldSt);log(`Увеличено: ${({str:'сила',agi:'ловкость',luck:'удача',end:'выносливость'})[k]}.`);save();render()}
function ask(){if(travel)return;const a=spots[g.pos].a;let s;if(g.battle){const intent=enemyIntent(g.battle);s=g.level<10?'У него виден замах. Смотри на движения — это лучше слепого удара.':`Судя по стойке, опасайся удара: ${intent.hit.toLowerCase()}. Но он может хитрить.`;}else if(g.hp<16)s='Наше здоровье напоминает остаток батареи старого телефона: 5 процентов и никакой зарядки.';else if(a==='herb'||a==='flower')s=g.level>=10?(a==='herb'?'Зелёная сердцелистная трава: лечебное сырьё.':'Багряный цветок: токсичен. В будущем пригодится алхимику.'): 'С научной точки зрения, это растение. Для более глубокого анализа мне нужен 10-й уровень.';else if(a==='merchant')s='Прежде чем покупать оружие, проверь его требования. Да, я знаю: сначала хочется купить, потом думать.';else if(a==='camp')s='Можно отдохнуть, но нужен сухарь. Даже в фантастическом мире калории не бесплатны.';else{const a=['Я всё ещё не знаю, почему нас призвали. Возможно, ошиблись номером мира.','На карте полно белых пятен. Это не дизайн, это отсутствие информации.','Если увидите дракона — не проверяйте, какой у него уровень голыми руками.','Я бы предложила план, но наш последний план состоял из слов «а давай попробуем».'];s=a[g.systemCalls%a.length];}g.systemCalls++;speak(s,true);save();render()}
function timeText(){const h=Math.floor(g.minutes/60),m=g.minutes%60;return `День ${g.day} · ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`}
function events(){return `<section class="panel"><h2>Последние события</h2>${g.lines.slice(0,4).map(s=>`<div class="feed">${esc(s)}</div>`).join('')}</section>`}
function renderFight(){const b=g.battle,e=enemies[b.id],tell=enemyIntent(b),disabled=(mode==='Силовой'&&g.st<6)||(mode==='Финт'&&g.st<4);return `<section class="panel"><h2>⚔️ ${esc(e.name)} · раунд ${b.turn}</h2><div class="small">Здоровье врага: ${b.hp}/${b.max}</div><div class="meter"><i style="width:${Math.round(b.hp/b.max*100)}%;background:#cf7b6a"></i></div><div class="sys">👁 <strong>Наблюдение:</strong> ${esc(hints[tell.hit])}<br><span class="small">Это подсказка, а не гарантия будущих действий.</span></div><div class="small">Куда ударить?</div><div class="choices">${['Голова','Корпус','Ноги'].map(s=>`<button data-select="attack" data-value="${s}" class="${attack===s?'selected':''}">${s}</button>`).join('')}</div><div class="small">Что защищать?</div><div class="choices">${['Голова','Корпус','Ноги'].map(s=>`<button data-select="defend" data-value="${s}" class="${defend===s?'selected':''}">${s}</button>`).join('')}</div><div class="small">Тактика</div><div class="choices">${[['Быстрый','+1 сила'],['Силовой','−6 силы'],['Финт','−4 силы'],['Защита','+6 силы']].map(([s,c])=>`<button data-select="mode" data-value="${s}" class="${mode===s?'selected':''}">${s}<br><span class="small">${c}</span></button>`).join('')}</div><div class="actions">${button(mode==='Защита'?'Защититься':'Выполнить приём','fight','primary',disabled)}${button('Попытаться отступить','flee')}${button('Позвать Систему','ask')}</div><p class="small">Силовой удар сильнее, но тратит выносливость. Финт частично пробивает блок. Защита экономит здоровье и возвращает силы.</p></section>${events()}`}
function renderShop(){return `<div class="divider"></div><h2>Торговец</h2><div class="row"><span>Потрёпанный нож <span class="small">(треб. Сила 4, Ловкость 4)</span></span><span>6 🪙 · запас: ${g.shop.knife}</span></div><div class="row"><span>Сухарь</span><span>3 🪙 · запас: ${g.shop.bread}</span></div><div class="actions">${button('Купить нож','buy:knife','primary',g.shop.knife<=0||g.coins<6||g.items['Потрёпанный нож']>=1)}${button('Купить сухарь','buy:bread','',g.shop.bread<=0||g.coins<3)}${button('Продать траву · 4 🪙','sell:herb','',!g.items['Зелёная трава'])}${button('Продать металл · 3 🪙','sell:shard','',!g.items['Металлический осколок'])}</div>`}
function renderWorld(){if(travel)return `<section class="panel travel"><div class="spinner"></div><h2>Вы идёте к месту: ${esc(spots[travel.target].n)}</h2><div class="small">${esc(travel.detail)}</div><div class="sys">✦ Система: «Осторожнее. Местные карты явно рисовал человек с недобрым чувством юмора».</div>${button('Пропустить переход','skip','primary')}</section>`;
if(g.battle)return renderFight();const s=spots[g.pos];let html=`<section class="panel"><h2>${esc(s.n)}</h2><p>${esc(s.d)}</p><div class="small">${timeText()} · Монеты: ${g.coins}</div></section><section class="panel"><h2>Куда дальше?</h2><div class="actions">${s.ex.map(i=>button('→ '+spots[i].n,'move:'+i,g.visited.includes(i)?'':'primary')).join('')}</div><div class="divider"></div><h2>Что сделать?</h2><div class="actions">${s.a.startsWith('enemy')&&!g.resolved[s.a]?button('Осмотреть угрозу','inspect','primary'):s.a.startsWith('enemy')?'<span class="small">Место боя пустует. Противник побеждён.</span>':button(s.a==='herb'||s.a==='flower'?'Собрать растение':s.a==='shard'?'Осмотреть находку':s.a==='camp'?'Осмотреть лагерь':s.a==='final'?'Посмотреть на деревню':'Осмотреться','inspect')}${s.a.startsWith('enemy')&&!g.resolved[s.a]?button('Попробовать засаду','ambush','danger'):''}${s.a==='camp'?button('Отдохнуть (1 сухарь, 2 ч)','rest','',g.hp===maxHp()&&g.st===maxSt()):''}${button('Позвать Систему','ask')}</div>${s.a==='merchant'?renderShop():''}</section>`;return html+events()}
function renderHero(){const names={str:'Сила',agi:'Ловкость',luck:'Удача',end:'Выносливость'};return `<section class="panel"><h2>Путешественник · уровень ${g.level}</h2><div class="small">Свободные очки: ${g.points} · Монеты: ${g.coins} · ${timeText()}</div>${Object.keys(names).map(k=>`<div class="row"><span>${names[k]}</span><div><b>${g.stats[k]}</b> ${g.points?button('+','boost:'+k,'mutebtn'):''}</div></div>`).join('')}<div class="divider"></div><div class="row"><span>Оружие</span><b>${esc(g.gear)}</b></div><div class="small">Нож требует силу 4 и ловкость 4. Уровень не лечит полностью.</div><div class="actions">${button('Экипировать нож','equip','',!g.items['Потрёпанный нож'])}${button('Позвать Систему','ask')}</div></section><section class="panel"><h2>Рюкзак</h2>${Object.entries(g.items).filter(([,count])=>count>0).map(([n,c])=>`<div class="row"><span>${esc(n)}</span><b>×${c}</b></div>`).join('')||'<p>Пусто</p>'}</section>`}
function renderJournal(){return `<section class="panel"><h2>Изученный лес · ${g.visited.length}/${spots.length}</h2><div class="map">${spots.map((s,i)=>`<div class="cell ${g.pos===i?'current':g.visited.includes(i)?'':'hidden'}">${g.pos===i?'◎ ':''}${g.visited.includes(i)?esc(s.n):'???'}</div>`).join('')}</div><p class="small">Собрано образцов: ${g.discovered.length} · Побед: ${g.wins} · Поражений: ${g.losses}</p><p class="small">Система: ${g.level>=10?'Модуль анализа растений открыт':'Анализ растений откроется на 10-м уровне'}</p><div class="small">${g.known.includes('herb')?'Торговец объяснил свойства сердцелистной травы.':'Пока нет записей об известных растениях.'}</div></section>${events()}<section class="panel"><h2>Тестирование и сохранение</h2><p class="small">Сохранение автоматическое. Кнопка уровня 10 только для проверки возможностей Системы.</p><div class="actions">${button('Тест: уровень 10','debug10')}${button('Начать заново','reset','danger')}</div></section>`}
function render(){const n=needXp();document.getElementById('lvl').textContent='Уровень '+g.level;document.getElementById('location').textContent=travel?'В дороге…':spots[g.pos].n;document.getElementById('locationSub').textContent=timeText()+' · '+g.coins+' монет';document.getElementById('eyebrow').textContent='Глава I · '+(g.level>=10?'Познание':'Выживание');document.getElementById('scene').className='scene '+spots[g.pos].v;document.getElementById('hp').textContent=g.hp+'/'+maxHp();document.getElementById('st').textContent=g.st+'/'+maxSt();document.getElementById('xp').textContent=g.xp+'/'+n;document.getElementById('hpbar').style.width=Math.min(100,g.hp/maxHp()*100)+'%';document.getElementById('stbar').style.width=Math.min(100,g.st/maxSt()*100)+'%';document.getElementById('xpbar').style.width=Math.min(100,g.xp/n*100)+'%';document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));document.getElementById('main').innerHTML=tab==='world'?renderWorld():tab==='hero'?renderHero():renderJournal()}
document.body.addEventListener('click',e=>{const t=e.target.closest('button');if(!t||t.disabled)return;if(t.dataset.tab){tab=t.dataset.tab;render();return}if(t.dataset.select){if(t.dataset.select==='attack')attack=t.dataset.value;else if(t.dataset.select==='defend')defend=t.dataset.value;else mode=t.dataset.value;render();return}const action=t.dataset.action;if(!action)return;const [cmd,arg]=action.split(':');if(cmd==='skip')finishMove();else if(cmd==='move')startMove(+arg);else if(cmd==='inspect')inspect();else if(cmd==='ambush')startFight(spots[g.pos].a,true);else if(cmd==='fight')fight();else if(cmd==='flee')flee();else if(cmd==='rest')rest();else if(cmd==='buy')buy(arg);else if(cmd==='sell')sell(arg);else if(cmd==='equip')equip();else if(cmd==='boost')boost(arg);else if(cmd==='ask')ask();else if(cmd==='debug10'){if(!confirm('Поднять уровень до 10 только для проверки Системы?'))return;if(g.level<10){g.level=10;g.points+=18;speak('Модуль растений восстановлен. Наконец-то могу отличить обед от отравления.',true)}save();render()}else if(cmd==='reset'){if(!confirm('Полностью удалить сохранение v0.2 и начать заново?'))return;clearTimeout(travelTimer);travel=null;g=fresh();tab='world';save();render()}});
save();render();
})();
</script></body></html>
