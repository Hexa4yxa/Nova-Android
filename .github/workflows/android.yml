name: NOVA Android APK

# Keep only the most recent code revision building on each development branch.
concurrency:
  group: nova-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main, fix/nova-streaming-android, experiment/nova-gemma, feature/nova-director-council, feature/nova-tools-approved-downloads, feature/nova-local-image-tools, feature/nova-image-hardening, feature/nova-brains-auto, feature/nova-native-image-engine]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: 8a199ad31a7eb27d5a46a6b08026176d82bc9894
          path: llama.cpp

      - name: Checkout pinned native image engine
        if: github.ref == 'refs/heads/feature/nova-native-image-engine'
        uses: actions/checkout@v4
        with:
          repository: leejet/stable-diffusion.cpp
          ref: 58bb3c1b1cd4749e94e39f537e9adfce295dcaee
          path: android/stable-diffusion.cpp
          submodules: recursive
          persist-credentials: false

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          test -x "$ANDROID_HOME/platform-tools/adb"
          echo "Android SDK found"


      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.13113456"
          test -f "$ANDROID_HOME/ndk/29.0.13113456/build/cmake/android.toolchain.cmake"
          echo "Android NDK ready"

      - name: Install Android CMake
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "cmake;3.31.6"
          test -f "$ANDROID_HOME/cmake/3.31.6/bin/cmake"
          echo "Android CMake ready"

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Check Director Council UI syntax and wiring
        if: github.ref == 'refs/heads/feature/nova-director-council' || github.ref == 'refs/heads/feature/nova-tools-approved-downloads' || github.ref == 'refs/heads/feature/nova-local-image-tools' || github.ref == 'refs/heads/feature/nova-image-hardening' || github.ref == 'refs/heads/feature/nova-brains-auto' || github.ref == 'refs/heads/feature/nova-native-image-engine'
        run: |
          node --test tests/council-ui.test.cjs
          if [ "$GITHUB_REF" = 'refs/heads/feature/nova-tools-approved-downloads' ] || [ "$GITHUB_REF" = 'refs/heads/feature/nova-local-image-tools' ] || [ "$GITHUB_REF" = 'refs/heads/feature/nova-image-hardening' ] || [ "$GITHUB_REF" = 'refs/heads/feature/nova-brains-auto' ] || [ "$GITHUB_REF" = 'refs/heads/feature/nova-native-image-engine' ]; then node --test tests/nova-tools-ui.test.cjs; fi
          if [ "$GITHUB_REF" = 'refs/heads/feature/nova-local-image-tools' ] || [ "$GITHUB_REF" = 'refs/heads/feature/nova-image-hardening' ] || [ "$GITHUB_REF" = 'refs/heads/feature/nova-brains-auto' ] || [ "$GITHUB_REF" = 'refs/heads/feature/nova-native-image-engine' ]; then node --test tests/nova-image-ui.test.cjs; fi
          if [ "$GITHUB_REF" = 'refs/heads/feature/nova-brains-auto' ] || [ "$GITHUB_REF" = 'refs/heads/feature/nova-native-image-engine' ]; then node --test tests/nova-brains-ui.test.cjs; fi
          if [ "$GITHUB_REF" = 'refs/heads/feature/nova-native-image-engine' ]; then node --test tests/nova-native-image.test.cjs; fi
          if [ "$GITHUB_REF" = 'refs/heads/feature/nova-native-image-engine' ]; then node --test tests/nova-tool-registry.test.cjs; fi
          if [ "$GITHUB_REF" = 'refs/heads/feature/nova-native-image-engine' ]; then node --test tests/nova-model-recovery.test.cjs; fi

      - name: Build APK and run Kotlin unit tests
        working-directory: android
        run: |
          if [ "$GITHUB_REF" = 'refs/heads/feature/nova-director-council' ] || [ "$GITHUB_REF" = 'refs/heads/feature/nova-tools-approved-downloads' ] || [ "$GITHUB_REF" = 'refs/heads/feature/nova-local-image-tools' ] || [ "$GITHUB_REF" = 'refs/heads/feature/nova-image-hardening' ] || [ "$GITHUB_REF" = 'refs/heads/feature/nova-brains-auto' ] || [ "$GITHUB_REF" = 'refs/heads/feature/nova-native-image-engine' ]; then
            bash gradlew testDebugUnitTest assembleDebug --no-daemon
          else
            bash gradlew assembleDebug --no-daemon
          fi

      - name: Verify native image engine is packaged
        if: github.ref == 'refs/heads/feature/nova-native-image-engine'
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libnova-image.so'
          echo 'Native image engine included; real generation requires a compatible model and on-device verification.'

      # Prove the *release* build path compiles before asking the owner to
      # configure secrets. Sign this disposable APK with a temporary key and
      # NEVER publish or upload it: it must not become the stable signer.
      - name: Smoke-test Stable release package with throwaway CI signer
        if: github.ref == 'refs/heads/feature/nova-native-image-engine'
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          export NOVA_SIGNING_PASSWORD="$(openssl rand -hex 24)"
          export NOVA_STABLE_KEYSTORE_PATH="$RUNNER_TEMP/nova-throwaway-ci.p12"
          export NOVA_STABLE_VERSION_CODE=100001
          keytool -genkeypair -alias nova-stable -keyalg RSA -keysize 2048 \
            -validity 1 -storetype PKCS12 \
            -keystore "$NOVA_STABLE_KEYSTORE_PATH" \
            -storepass:env NOVA_SIGNING_PASSWORD -keypass:env NOVA_SIGNING_PASSWORD \
            -dname "CN=NOVA Throwaway CI Test" -noprompt >/dev/null
          bash gradlew assembleRelease --no-daemon
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep "package: name='ai.nova.director.stable'"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libnova-image.so'
          rm -f "$NOVA_STABLE_KEYSTORE_PATH" "$APK"
          echo "Release build/package smoke test passed. No real stable APK was published."

      # Debug APKs from disposable GitHub-runner keys CANNOT update the existing
      # NOVA native-image install. Do not publish them as user-facing releases.
      # Keep CI artifact solely for developer inspection.
      - name: Upload non-installable CI debug artifact for native-image branch
        if: github.ref == 'refs/heads/feature/nova-native-image-engine'
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-DEBUG-INSPECTION-ONLY-NOT-AN-UPDATE
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload NOVA debug APK for other experiment branches
        if: github.ref != 'refs/heads/feature/nova-native-image-engine'
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish isolated NOVA Brains Lab APK
        if: github.ref == 'refs/heads/feature/nova-brains-auto'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/NOVA-Brains-Lab.apk
          gh release create "nova-brains-lab-${{ github.run_number }}" release/NOVA-Brains-Lab.apk \
            --title "NOVA Brains Lab #${{ github.run_number }}" \
            --notes "Separate offline brains manager. Detect imported GGUF, model selection and optional Local Dream controlled mode. First-time permissions and on-device verification required." \
            --prerelease --target "${{ github.sha }}"

      - name: Publish isolated NOVA Image QA APK
        if: github.ref == 'refs/heads/feature/nova-image-hardening'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/NOVA-Image-QA.apk
          gh release create "nova-image-qa-${{ github.run_number }}" release/NOVA-Image-QA.apk \
            --title "NOVA Image QA #${{ github.run_number }}" \
            --notes "Separate Android test build. Adds Local Dream launch button, connection diagnostics, 77-token guard, quick/quality presets, and natural-language drawing requests. Existing installed NOVA versions unaffected. On-device verification still required." \
            --prerelease --target "${{ github.sha }}"

      - name: Publish isolated NOVA Image Pilot APK
        if: github.ref == 'refs/heads/feature/nova-local-image-tools'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/NOVA-Image-Pilot.apk
          gh release create "nova-image-pilot-${{ github.run_number }}" release/NOVA-Image-Pilot.apk \
            --title "NOVA Image Pilot #${{ github.run_number }}" \
            --notes "Experimental standalone NOVA with Local Dream image generation. Open Local Dream with a selected model, leave port 8081 free. Saves PNG to Pictures/NOVA; on-device verification required." \
            --prerelease --target "${{ github.sha }}"

      - name: Publish isolated NOVA Tools test APK
        if: github.ref == 'refs/heads/feature/nova-tools-approved-downloads'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/NOVA-Tools-Lab.apk
          gh release create "nova-tools-lab-${{ github.run_number }}" release/NOVA-Tools-Lab.apk \
            --title "NOVA Tools Lab #${{ github.run_number }}" \
            --notes "Experimental standalone test build. Explicit confirmation for HTTPS downloads, SHA-256 and export. Does not autonomously install software or replace Director Lab. On-device functionality unverified." \
            --prerelease --target "${{ github.sha }}"

      - name: Publish Director Council test APK
        if: github.ref == 'refs/heads/feature/nova-director-council'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/NOVA-Director-Lab.apk
          gh release create "nova-director-lab-${{ github.run_number }}" release/NOVA-Director-Lab.apk \
            --title "NOVA Director Lab #${{ github.run_number }}" \
            --notes "Experimental offline Director Council: Gemma as director, inner voice and text Critic. Independent app, three sequential roles. Does not perform video editing yet." \
            --prerelease --target "${{ github.sha }}"

      - name: Publish NOVA Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/NOVA-debug.apk
          gh release create "nova-build-${{ github.run_number }}" release/NOVA-debug.apk --title "NOVA Android #${{ github.run_number }}" --notes "Test APK for NOVA Android." --prerelease --target "${{ github.sha }}"
