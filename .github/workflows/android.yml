name: NOVA Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, fix/nova-streaming-android, experiment/nova-gemma, feature/nova-director-council]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: 8a199ad31a7eb27d5a46a6b08026176d82bc9894
          path: llama.cpp

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          test -x "$ANDROID_HOME/platform-tools/adb"
          echo "Android SDK found"


      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.13113456"
          test -f "$ANDROID_HOME/ndk/29.0.13113456/build/cmake/android.toolchain.cmake"
          echo "Android NDK ready"

      - name: Install Android CMake
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "cmake;3.31.6"
          test -f "$ANDROID_HOME/cmake/3.31.6/bin/cmake"
          echo "Android CMake ready"

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Check Director Council UI syntax and wiring
        if: github.ref == 'refs/heads/feature/nova-director-council'
        run: node --test tests/council-ui.test.cjs

      - name: Build APK and run Kotlin unit tests
        working-directory: android
        run: |
          if [ "$GITHUB_REF" = 'refs/heads/feature/nova-director-council' ]; then
            bash gradlew testDebugUnitTest assembleDebug --no-daemon
          else
            bash gradlew assembleDebug --no-daemon
          fi

      - name: Upload NOVA APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish NOVA Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/NOVA-debug.apk
          gh release create "nova-build-${{ github.run_number }}" release/NOVA-debug.apk --title "NOVA Android #${{ github.run_number }}" --notes "Test APK for NOVA Android." --prerelease --target "${{ github.sha }}"
