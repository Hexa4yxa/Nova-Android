name: NOVA Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: master
          path: llama.cpp

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          test -x "$ANDROID_HOME/platform-tools/adb"
          echo "Android SDK found"


      - name: Install Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.13113456"
          test -f "$ANDROID_HOME/ndk/29.0.13113456/build/cmake/android.toolchain.cmake"
          echo "Android NDK ready"

      - name: Install Android CMake
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "cmake;3.31.6"
          test -f "$ANDROID_HOME/cmake/3.31.6/bin/cmake"
          echo "Android CMake ready"

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: bash gradlew assembleDebug --no-daemon

      - name: Upload NOVA APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
