name: NOVA Image - subject and timing verification
on:
  push:
    branches: [fix/nova-image-subject-and-timings]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nova-image-subject-verification
  cancel-in-progress: true
jobs:
  safety-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout new image changes
        uses: actions/checkout@v4
      - name: Checkout pinned llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: 8a199ad31a7eb27d5a46a6b08026176d82bc9894
          path: llama.cpp
          persist-credentials: false
      - name: Checkout pinned stable-diffusion.cpp
        uses: actions/checkout@v4
        with:
          repository: leejet/stable-diffusion.cpp
          ref: 58bb3c1b1cd4749e94e39f537e9adfce295dcaee
          path: android/stable-diffusion.cpp
          submodules: recursive
          persist-credentials: false
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Android toolchain
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.13113456" "cmake;3.31.6"
      - name: Verify image prompts, manager and UI regression tests
        run: |
          npm ci
          node --test tests/*.test.cjs
      - name: Capacitor sync
        run: npx cap sync android
      - name: Compile JNI, Kotlin and debug Android app
        working-directory: android
        run: bash gradlew testDebugUnitTest assembleDebug --no-daemon
      - name: Verify image library exists in APK
        run: unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libnova-image.so'
      # No test APK distribution; use only owner-signed Stable for the phone.
