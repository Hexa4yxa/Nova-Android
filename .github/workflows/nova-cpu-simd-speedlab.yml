name: NOVA CPU SIMD Speed Lab (isolated test APK)
on:
  push:
    branches: [experiment/nova-arm-cpu-simd-speed-20261108]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compile-simd-cpu:
    runs-on: ubuntu-latest
    env:
      NOVA_CPU_ARM_TUNED: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned text engine
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: 8a199ad31a7eb27d5a46a6b08026176d82bc9894
          path: llama.cpp
          persist-credentials: false
      - name: Checkout pinned SD engine
        uses: actions/checkout@v4
        with:
          repository: leejet/stable-diffusion.cpp
          ref: 58bb3c1b1cd4749e94e39f537e9adfce295dcaee
          path: android/stable-diffusion.cpp
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.13113456" "cmake;3.31.6"
      - name: Run all existing NOVA regressions
        run: |
          npm ci
          node --test tests/*.test.cjs
      - name: Compile isolated FP16/DOTPROD CPU APK and unit tests
        run: |
          npx cap sync android
          cd android
          bash gradlew testDebugUnitTest assembleDebug --no-daemon
      - name: Prove native speed lab packaging and isolation
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libnova-image.so'
          if unzip -l "$APK" | grep 'lib/arm64-v8a/libnova-image-gpu.so'; then exit 1; fi
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt" dump badging "$APK" | grep 'ai.nova.director.speedlab'
          echo 'Compiled only; speed and quality on Redmi are NOT yet measured.'

      - name: Prepare experimental APK for direct download
        run: |
          set -euo pipefail
          mkdir -p speedlab
          cp android/app/build/outputs/apk/debug/app-debug.apk speedlab/NOVA-Speed-Lab.apk
          (cd speedlab && sha256sum NOVA-Speed-Lab.apk > SHA256SUMS.txt)
          (cd speedlab && zip -9 -q NOVA-Speed-Lab-ZIP.zip NOVA-Speed-Lab.apk SHA256SUMS.txt)
          unzip -t speedlab/NOVA-Speed-Lab-ZIP.zip
      - name: Save experimental APK in GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-CPU-Speed-Lab-${{ github.run_number }}
          path: |
            speedlab/NOVA-Speed-Lab.apk
            speedlab/SHA256SUMS.txt
            speedlab/NOVA-Speed-Lab-ZIP.zip
          if-no-files-found: error
          retention-days: 30
      - name: Publish explicitly experimental test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "nova-cpu-speedlab-${{ github.run_number }}" \
            speedlab/NOVA-Speed-Lab.apk speedlab/NOVA-Speed-Lab-ZIP.zip speedlab/SHA256SUMS.txt \
            --target "${{ github.sha }}" \
            --title "NOVA CPU Speed Lab #${{ github.run_number }} — EXPERIMENT" \
            --prerelease \
            --notes "EXPERIMENTAL ANDROID APP. It installs as ai.nova.director.speedlab beside the stable NOVA (different package and app storage). Never delete or uninstall stable NOVA to test this. Snapdragon ARM FP16/DOTPROD CPU optimization was compiled but has NOT been speed/quality validated on a real phone; do not assume faster rendering. It will need its own image model import because app storage is separate. APK signed with an ephemeral test key: not an in-place stable update. Same 512px 12-step SD 1.5 rendering, no experimental GPU. Use ZIP if a mobile browser hangs finalizing an APK."