name: NOVA CPU SIMD Speed Lab (no release)
on:
  push:
    branches: [experiment/nova-arm-cpu-simd-speed-20261108]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-simd-cpu:
    runs-on: ubuntu-latest
    env:
      NOVA_CPU_ARM_TUNED: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned text engine
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: 8a199ad31a7eb27d5a46a6b08026176d82bc9894
          path: llama.cpp
          persist-credentials: false
      - name: Checkout pinned SD engine
        uses: actions/checkout@v4
        with:
          repository: leejet/stable-diffusion.cpp
          ref: 58bb3c1b1cd4749e94e39f537e9adfce295dcaee
          path: android/stable-diffusion.cpp
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.13113456" "cmake;3.31.6"
      - name: Run all existing NOVA regressions
        run: |
          npm ci
          node --test tests/*.test.cjs
      - name: Compile isolated FP16/DOTPROD CPU APK and unit tests
        run: |
          npx cap sync android
          cd android
          bash gradlew testDebugUnitTest assembleDebug --no-daemon
      - name: Prove native speed lab packaging and isolation
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libnova-image.so'
          if unzip -l "$APK" | grep 'lib/arm64-v8a/libnova-image-gpu.so'; then exit 1; fi
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt" dump badging "$APK" | grep 'ai.nova.director.speedlab'
          echo 'Compiled only; speed and quality on Redmi are NOT yet measured.'
