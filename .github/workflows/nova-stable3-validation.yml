name: NOVA Stable 3 - story and GPU experiment verification
on:
  push:
    branches: [feature/nova-stable3-story-gpu-lab]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  offline-story-and-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned native LLM
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: 8a199ad31a7eb27d5a46a6b08026176d82bc9894
          path: llama.cpp
          persist-credentials: false
      - name: Checkout pinned image engine
        uses: actions/checkout@v4
        with:
          repository: leejet/stable-diffusion.cpp
          ref: 58bb3c1b1cd4749e94e39f537e9adfce295dcaee
          path: android/stable-diffusion.cpp
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned Android toolchain
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.13113456" "cmake;3.31.6"
      - name: Storyboard + performance + existing app regression tests
        run: |
          npm ci
          node --test tests/*.test.cjs
      - name: Compile unchanged CPU fallback, plus GPU driver probe
        run: |
          npx cap sync android
          cd android
          bash gradlew testDebugUnitTest assembleDebug --no-daemon
      - name: Confirm model runner and image library present
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libnova-image.so'
      # CI debug APK is not distributed, never signs or publishes a new app.

  experimental-opencl-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned image engine
        uses: actions/checkout@v4
        with:
          repository: leejet/stable-diffusion.cpp
          ref: 58bb3c1b1cd4749e94e39f537e9adfce295dcaee
          path: android/stable-diffusion.cpp
          submodules: recursive
          persist-credentials: false
      - name: Checkout Khronos OpenCL headers - test only
        uses: actions/checkout@v4
        with:
          repository: KhronosGroup/OpenCL-Headers
          ref: v2026.05.29
          path: opencl-headers
          persist-credentials: false
      - name: Checkout Khronos ICD loader - test only
        uses: actions/checkout@v4
        with:
          repository: KhronosGroup/OpenCL-ICD-Loader
          ref: v2026.05.29
          path: opencl-loader
          persist-credentials: false
      - name: Install Android native toolchain
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.13113456" "cmake;3.31.6"
      - name: Build Khronos OpenCL loader for arm64 Android
        shell: bash
        run: |
          set -euo pipefail
          CMAKE="$ANDROID_HOME/cmake/3.31.6/bin/cmake"
          NDK="$ANDROID_HOME/ndk/29.0.13113456"
          "$CMAKE" -S opencl-loader -B opencl-loader/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DOPENCL_ICD_LOADER_HEADERS_DIR="$GITHUB_WORKSPACE/opencl-headers" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=33 \
            -DOPENCL_ICD_LOADER_BUILD_TESTING=OFF
          "$CMAKE" --build opencl-loader/build --parallel 2
      - name: Compile native Stable Diffusion with experimental OpenCL
        shell: bash
        run: |
          set -euo pipefail
          CMAKE="$ANDROID_HOME/cmake/3.31.6/bin/cmake"
          NDK="$ANDROID_HOME/ndk/29.0.13113456"
          OPENCL_LIB="$(find "$GITHUB_WORKSPACE/opencl-loader/build" -name libOpenCL.so -type f | head -1)"
          test -s "$OPENCL_LIB"
          "$CMAKE" -S android/nova-image/src/main/cpp -B android/opencl-experiment -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=33 \
            -DCMAKE_BUILD_TYPE=Release \
            -DNOVA_EXPERIMENTAL_OPENCL=ON \
            -DOpenCL_INCLUDE_DIR="$GITHUB_WORKSPACE/opencl-headers" \
            -DOpenCL_LIBRARY="$OPENCL_LIB"
          "$CMAKE" --build android/opencl-experiment --target nova-image --parallel 2
      # No APK published and no claim about runtime driver, quality or speed.
