name: NOVA - validate model manager and image speed

on:
  push:
    branches:
      - fix/nova-model-health-image-presets
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-brain-speed-validation
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout updated NOVA source
        uses: actions/checkout@v4

      - name: Checkout pinned llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: 8a199ad31a7eb27d5a46a6b08026176d82bc9894
          path: llama.cpp
          persist-credentials: false

      - name: Checkout pinned image engine
        uses: actions/checkout@v4
        with:
          repository: leejet/stable-diffusion.cpp
          ref: 58bb3c1b1cd4749e94e39f537e9adfce295dcaee
          path: android/stable-diffusion.cpp
          submodules: recursive
          persist-credentials: false

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Android toolchain
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Verify UI and model-recovery behavior
        run: |
          npm ci
          node --test tests/*.test.cjs

      - name: Sync Android Capacitor
        run: npx cap sync android

      - name: Verify Kotlin tests and debug APK build
        working-directory: android
        run: bash gradlew testDebugUnitTest assembleDebug --no-daemon

      - name: Ensure image library exists in debug APK
        run: unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libnova-image.so'

      - name: Upload unsigned-development APK for inspection
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-NEW-FIXES-DEBUG-NOT-STABLE-UPDATE
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # This workflow never signs or publishes a stable APK.
