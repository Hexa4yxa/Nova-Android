name: NOVA Stable • signed manual release

# Intentionally NOT triggered by push. Never publish a debug-signed APK as
# the permanent NOVA. The owner configures the one permanent signing key
# through GitHub Actions secrets before running this workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nova-stable-release
  cancel-in-progress: false

jobs:
  stable:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm approved stable source branch
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/feature/nova-native-image-engine" ]; then
            echo "::error::Run only from the tested native-image branch until migration is approved."
            exit 1
          fi

      - name: Checkout NOVA
        uses: actions/checkout@v4

      - name: Checkout pinned llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: 8a199ad31a7eb27d5a46a6b08026176d82bc9894
          path: llama.cpp
          persist-credentials: false

      - name: Checkout pinned native SD engine
        uses: actions/checkout@v4
        with:
          repository: leejet/stable-diffusion.cpp
          ref: 58bb3c1b1cd4749e94e39f537e9adfce295dcaee
          path: android/stable-diffusion.cpp
          submodules: recursive
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Android NDK and CMake
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.13113456" "cmake;3.31.6"
          test -f "$ANDROID_HOME/ndk/29.0.13113456/build/cmake/android.toolchain.cmake"
          test -f "$ANDROID_HOME/cmake/3.31.6/bin/cmake"

      - name: Check that permanent signing secrets exist
        env:
          KEYSTORE_B64: ${{ secrets.NOVA_SIGNING_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.NOVA_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NOVA_SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.NOVA_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Stable signing is NOT configured. Do not uninstall the installed NOVA. Owner must add permanent signing key and GitHub secrets."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/nova-stable.jks"
          test -s "$RUNNER_TEMP/nova-stable.jks"

      - name: Install dependencies and sync Capacitor
        run: |
          npm ci
          npx cap sync android

      - name: Verify NOVA offline tools contracts
        run: |
          node --test tests/council-ui.test.cjs tests/nova-tools-ui.test.cjs tests/nova-image-ui.test.cjs tests/nova-brains-ui.test.cjs tests/nova-native-image.test.cjs tests/nova-tool-registry.test.cjs

      - name: Set monotonically increasing stable version
        shell: bash
        run: echo "NOVA_STABLE_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Kotlin tests and permanently signed stable APK
        working-directory: android
        env:
          NOVA_STABLE_KEYSTORE_PATH: ${{ runner.temp }}/nova-stable.jks
          NOVA_STABLE_STORE_PASSWORD: ${{ secrets.NOVA_SIGNING_STORE_PASSWORD }}
          NOVA_STABLE_KEY_ALIAS: ${{ secrets.NOVA_SIGNING_KEY_ALIAS }}
          NOVA_STABLE_KEY_PASSWORD: ${{ secrets.NOVA_SIGNING_KEY_PASSWORD }}
        run: |
          bash gradlew testDebugUnitTest assembleRelease --no-daemon

      - name: Verify signature and stable package identity
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libnova-image.so'
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/aapt"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep "package: name='ai.nova.director.stable'"
          mkdir -p release
          cp "$APK" release/NOVA-Stable.apk
          sha256sum release/NOVA-Stable.apk > release/SHA256SUMS.txt

      - name: Publish signed APK for in-place stable updates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "nova-stable-${{ github.run_number }}" release/NOVA-Stable.apk release/SHA256SUMS.txt \
            --title "NOVA Stable #${{ github.run_number }}" --prerelease \
            --notes "Permanent package: ai.nova.director.stable. Signed with the owner's stable key from GitHub Actions secrets. Future stable releases use the SAME key and increasing version codes for in-place updates. First install is side-by-side with old test APKs due to their incompatible ephemeral debug signatures. Restore SD1.5 using NOVA → Мозги → Восстановить из NOVA-Models (system picker; SHA-256 verified). DO NOT uninstall old NOVA or remove backed-up models until the new stable app is verified on the phone." \
            --target "${{ github.sha }}"

      - name: Clean up signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/nova-stable.jks"
