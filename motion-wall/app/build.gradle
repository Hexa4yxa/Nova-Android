plugins { id 'com.android.application' }
android {
    namespace 'ai.motionwall.cars'
    compileSdk 36
    defaultConfig {
        applicationId 'ai.motionwall.cars'
        minSdk 28
        targetSdk 36
        versionCode 3
        versionName '0.3-free-test'
    }
    // Re-use the owner's already pinned, permanent key from existing NOVA
    // infrastructure. The app has a distinct package ID and zero NOVA code.
    // This only signs when CI injects the key; debug builds stay isolated.
    signingConfigs {
        wallPermanent {
            def path = System.getenv('MOTION_WALL_KEYSTORE_PATH')
            if (path) {
                storeFile file(path)
                storeType 'pkcs12'
                storePassword System.getenv('NOVA_SIGNING_PASSWORD')
                keyAlias 'nova-stable'
                keyPassword System.getenv('NOVA_SIGNING_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('MOTION_WALL_KEYSTORE_PATH')) {
                signingConfig signingConfigs.wallPermanent
            }
        }
    }
    // Free Google ML Kit. Runs on-device; model downloads once via Play services.
    // It can cut out a car, but does NOT generate true AI driving video.
    dependencies {
        implementation 'com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
