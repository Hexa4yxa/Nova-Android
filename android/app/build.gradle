apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace = "ai.nova.director"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ai.nova.director"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode = Integer.parseInt(System.getenv('NOVA_STABLE_VERSION_CODE') ?: '1')
        versionName = "1.0.${System.getenv('NOVA_STABLE_VERSION_CODE') ?: '1'}"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
    // Stable NOVA must use an owner-controlled signing key that survives CI runs.
    // No keystores or passwords are ever stored in the repository.
    signingConfigs {
        novaStable {
            def keystorePath = System.getenv('NOVA_STABLE_KEYSTORE_PATH')
            if (keystorePath != null && !keystorePath.isEmpty()) {
                storeFile file(keystorePath)
                storeType 'pkcs12'
                // Same persistent PKCS12 password for store and private key.
                // Alias is fixed to prevent an accidental signer change.
                storePassword System.getenv('NOVA_SIGNING_PASSWORD')
                keyAlias 'nova-stable'
                keyPassword System.getenv('NOVA_SIGNING_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            // CI debug signing keys can change between GitHub-hosted runners.
            // Use a separate package for experimental builds to protect the
            // user's installed NOVA and its imported offline model.
            def isolatedBuild = System.getenv('GITHUB_REF') == 'refs/heads/fix/nova-streaming-android'
            // This test uses a fresh app-data directory, so the Qwen
            // installation and its saved GGUF remain untouched.
            def gemmaTest = System.getenv('GITHUB_REF') == 'refs/heads/experiment/nova-gemma'
            def councilTest = System.getenv('GITHUB_REF') == 'refs/heads/feature/nova-director-council'
            def toolsTest = System.getenv('GITHUB_REF') == 'refs/heads/feature/nova-tools-approved-downloads'
            def imageTest = System.getenv('GITHUB_REF') == 'refs/heads/feature/nova-local-image-tools'
            def imageHardening = System.getenv('GITHUB_REF') == 'refs/heads/feature/nova-image-hardening'
            def brainsAuto = System.getenv('GITHUB_REF') == 'refs/heads/feature/nova-brains-auto'
            def nativeImage = System.getenv('GITHUB_REF') == 'refs/heads/feature/nova-native-image-engine'
            def speedLab = System.getenv('GITHUB_REF') == 'refs/heads/experiment/nova-arm-cpu-simd-speed-20261108'
            applicationIdSuffix speedLab ? ".speedlab" : (nativeImage ? ".nativeimage" : (brainsAuto ? ".brainslab" : (imageHardening ? ".imageqa" : (imageTest ? ".imagepilot" : (toolsTest ? ".toolstest" : (councilTest ? ".counciltest" : (gemmaTest ? ".gemmafix" : (isolatedBuild ? ".testfix" : ".test"))))))))
            versionNameSuffix speedLab ? "-speedlab" : (nativeImage ? "-nativeimage" : (brainsAuto ? "-brainslab" : (imageHardening ? "-imageqa" : (imageTest ? "-imagepilot" : (toolsTest ? "-toolstest" : (councilTest ? "-counciltest" : (gemmaTest ? "-gemmafix" : (isolatedBuild ? "-testfix" : "-test"))))))))
        }
        release {
            // First stable install is a separate package because past debug APKs
            // had different CI signing keys. Future stable versions update in place.
            applicationIdSuffix ".stable"
            signingConfig signingConfigs.novaStable
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':nova-llama')
    implementation project(':nova-image')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
