plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ai.nova.image'
    compileSdk 36
    ndkVersion '29.0.13113456'

    defaultConfig {
        minSdk 33
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments '-DCMAKE_BUILD_TYPE=Release',
                          '-DGGML_NATIVE=OFF',
                          '-DGGML_OPENMP=OFF'
                // Owner-signed stable uses the identical ARMv8.2 CPU kernels already built
                // and exercised in Speed Lab on the target phone.
                if (System.getenv('NOVA_CPU_ARM_TUNED') == '1') {
                    arguments '-DNOVA_CPU_ARM_FP16_DOTPROD=ON'
                }
                // ONLY on the isolated CI GPU experiment, not on the signed Stable.
                if (System.getenv('NOVA_EXPERIMENTAL_OPENCL') == '1') {
                    def clHeaders = System.getenv('NOVA_OPENCL_INCLUDE_DIR')
                    def clLibrary = System.getenv('NOVA_OPENCL_LIBRARY')
                    if (!clHeaders || !clLibrary) {
                        throw new GradleException('GPU probe requires temporary Khronos headers and OpenCL loader')
                    }
                    arguments '-DNOVA_EXPERIMENTAL_OPENCL=ON',
                              "-DOpenCL_INCLUDE_DIR=${clHeaders}",
                              "-DOpenCL_LIBRARY=${clLibrary}"
                }
                cppFlags '-std=c++17'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.31.6'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
